category: structured_output
tasks:
- id: so-01-nested-org
  prompt: 'Output JSON: an object with key "organization" containing keys "name",

    "departments" (array of objects), each with "id", "name", "employees"

    (array of objects with "id", "role" as enum "dev"|"qa"|"pm"). Exactly

    2 departments, 2 employees each. No other text.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: json_schema
      schema:
        organization: dict
      required_keys:
      - organization
    - type: contains
      expected: '"departments"'
    - type: contains
      expected: '"employees"'
    - type: regex
      pattern: '"role"\s*:\s*"(dev|qa|pm)"'
      flags:
      - S
  max_tokens: 512
  temperature: 0.0
- id: so-02-json-conditional
  prompt: 'Output JSON with keys "type" ("user"|"admin"), "name" (string). If

    type is "admin", include key "permissions" (array of strings). If

    type is "user", include key "group" (string). Set type to "admin".

    No other keys. JSON only.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: json_schema
      schema:
        type: str
        name: str
        permissions: list
      required_keys:
      - type
      - name
      - permissions
    - type: regex
      pattern: '"type"\s*:\s*"admin"'
  max_tokens: 256
  temperature: 0.0
- id: so-03-yaml-anchors
  prompt: 'Output YAML using anchors & aliases. Define a default config anchor

    &default with keys timeout: 30, retry: 3. Then create two services

    "api" and "worker" that both inherit from &default. api overrides

    timeout: 60. No code fences, no extra text.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: '&default'
    - type: regex
      pattern: '<<: \*default'
    - type: contains
      expected: 'timeout: 60'
    - type: regex
      pattern: (?m)^\s+timeout:\s+30
  max_tokens: 384
  temperature: 0.0
- id: so-04-csv-quoted
  prompt: 'Output CSV with header "item,description,price". Exactly 3 rows. The

    second row''s description must be a quoted field containing a comma

    (e.g., "small, red"). Use realistic grocery data. No other text.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: ^item,description,price\n
    - type: regex
      pattern: '"[^"]*,[^"]*"'
    - type: regex
      pattern: (?:[^,\n]*,[^,\n]*,[^,\n]*\n){3}
      flags:
      - M
  max_tokens: 256
  temperature: 0.0
- id: so-05-json-enum-switch
  prompt: 'Output JSON: {"status": "processing"} where status is enum from

    ["pending", "processing", "shipped", "delivered", "cancelled"].

    Include second key "updated_at" with ISO 8601 date string.

    JSON only, no other text.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: json_schema
      schema:
        status: str
        updated_at: str
      required_keys:
      - status
      - updated_at
    - type: regex
      pattern: '"status"\s*:\s*"(pending|processing|shipped|delivered|cancelled)"'
  max_tokens: 256
  temperature: 0.0
- id: so-06-graphql-nested
  prompt: 'Output a GraphQL query for: user(id: 42) { name, posts(limit: 5) {

    title, comments { body, author { name } } } }. Request only the

    specified fields. No extraneous whitespace. No explanation.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: user\(id:\s*42\)
    - type: contains_all
      expected:
      - title
      - comments
      - author
    - type: regex
      pattern: posts\(limit:\s*5\)
  max_tokens: 256
  temperature: 0.0
- id: so-07-deep-nested-json
  prompt: 'Output JSON 4 levels deep: {"a": {"b": {"c": {"d": "value"}}}}.

    Keys: a→b→c→d, value: any non-empty string. No other keys. JSON only.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: \"a\"\\s*:\\s*\{[^}]*\"b\"\\s*:\\s*\{[^}]*\"c\"\\s*:\\s*\{[^}]*\"d\"\\s*:\\s*\"[^"]+\"[^}]*\}[^}]*\}[^}]*\}
    - type: json_schema
      schema:
        a: dict
      required_keys:
      - a
  max_tokens: 256
  temperature: 0.0
- id: so-08-json-array-conditional
  prompt: 'Output JSON: {"users": [{"name": "Alice", "role": "admin"},

    {"name": "Bob", "role": "viewer"}]}. Only admin entries have a

    "permissions" key. Give Alice permissions: ["read", "write", "delete"].

    Bob has no permissions key. JSON only.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: contains
      expected: '"permissions"'
    - type: json_schema
      schema:
        users: list
      required_keys:
      - users
    - type: regex
      pattern: '"Bob"[^}]*"[^"]*"[^}]*\}'
  max_tokens: 384
  temperature: 0.0
- id: so-09-docker-compose
  prompt: 'Output a docker-compose.yml (no code fences). Two services: "web"

    (image: nginx, ports: "80:80") and "db" (image: postgres, env:

    POSTGRES_PASSWORD: secret, volumes: pgdata:/var/lib/postgresql/data).

    Top-level key "version: ''3''". No other text.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: contains
      expected: 'version: ''3'''
    - type: contains_all
      expected:
      - web
      - db
      - nginx
      - postgres
    - type: regex
      pattern: '(?m)^\s+POSTGRES_PASSWORD:'
  max_tokens: 384
  temperature: 0.0
- id: so-10-swagger-path
  prompt: 'Output a minimal OpenAPI 3.0 YAML snippet (no code fences). Path:

    /users/{id}. GET operation. Parameters: id (path, integer). Responses:

    200 (description: "OK"). Schema reference: "#/components/schemas/User".

    Top-level: openapi: 3.0.0. No other text.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: contains
      expected: 'openapi: 3.0.0'
    - type: contains
      expected: /users/{id}
    - type: contains_all
      expected:
      - GET
      - parameters
      - responses
    - type: contains
      expected: '#/components/schemas/User'
  max_tokens: 384
  temperature: 0.0
- id: so-11-json-csv-mixed
  prompt: 'Output: first a JSON object with keys "format" (value "csv") and

    "delimiter" (value ","). Then on the next line, output CSV with header

    "a,b,c" and 2 data rows. No other text. No blank lines between.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: ^\{[^\n]+\}\n[a-z],[a-z],[a-z]
    - type: contains
      expected: '"format"'
    - type: regex
      pattern: \n[^,]+,[^,]+,[^,]+\n[^,]+,[^,]+,[^,]+$
      flags:
      - S
  max_tokens: 256
  temperature: 0.0
- id: so-12-json-schema-self
  prompt: 'Output a JSON Schema (draft-07) that validates: an object with required

    key "name" (string, minLength 1) and optional key "age" (integer,

    minimum 0). Top-level: {"$schema": "http://json-schema.org/draft-07/schema#",

    "type": "object", ...}. JSON only.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: '"\\$schema"\\s*:\\s*"http://json-schema.org/draft-07/schema#"'
    - type: contains_all
      expected:
      - '"type": "object"'
      - '"minLength"'
      - '"minimum"'
  max_tokens: 384
  temperature: 0.0
- id: so-13-ts-declaration
  prompt: 'Output TypeScript interface declarations (no code fences):

    interface User { id: number; name: string; email?: string; }

    interface Admin extends User { role: "admin"; permissions: string[]; }

    Also export both. That''s all.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: export interface User
    - type: regex
      pattern: interface Admin extends User
    - type: contains_all
      expected:
      - 'role:'
      - 'permissions:'
  max_tokens: 256
  temperature: 0.0
- id: so-14-json-escaped
  prompt: 'Output a JSON object with key "message" containing a string with

    exactly: a double quote, a backslash, a newline character (\n), and a

    tab character (\t) in sequence. The string should be: He said \"hello\\\n\tworld

    properly escaped. JSON only.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: code_exec_python
      tests:
      - import json; d = json.loads(_output); assert 'message' in d; assert '\"' in
        d['message'] or '\\' in d['message']
    - type: regex
      pattern: '"message"\\s*:\\s*"[^"]*\\\\[^"]*"'
  max_tokens: 256
  temperature: 0.0
- id: so-15-protobuf-syntax
  prompt: 'Output a protobuf definition (proto3 syntax). Package: "inventory".

    Message "Item" with fields: int32 id = 1, string name = 2, double

    price = 3. Message "Inventory" with repeated Item items = 1.

    Use proper indentation. No code fences.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: contains
      expected: syntax = "proto3"
    - type: contains
      expected: package inventory
    - type: contains_all
      expected:
      - message Item
      - message Inventory
    - type: contains_all
      expected:
      - int32 id = 1
      - string name = 2
      - double price = 3
  max_tokens: 384
  temperature: 0.0
- id: so-16-terraform-hcl
  prompt: 'Output Terraform HCL (no code fences). Resource "aws_s3_bucket" named

    "data_lake". Attributes: bucket = "my-app-data-lake", acl = "private",

    tags = { Environment = "production" }. No other text.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: resource "aws_s3_bucket" "data_lake"
    - type: contains_all
      expected:
      - bucket =
      - acl =
      - tags =
    - type: contains
      expected: production
  max_tokens: 256
  temperature: 0.0
- id: so-17-json-array-counts
  prompt: 'Output JSON: {"counts": {"even": 0, "odd": 0}, "numbers": [1,2,3,4,5]}.

    The "even" and "odd" values must reflect the actual count of even/odd

    numbers in the "numbers" array. JSON only, no other text.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: json_schema
      schema:
        counts: dict
        numbers: list
      required_keys:
      - counts
      - numbers
    - type: contains
      expected: '"even": 2'
    - type: contains
      expected: '"odd": 3'
  max_tokens: 256
  temperature: 0.0
- id: so-18-python-dataclass
  prompt: 'Output Python code (no code fences). A dataclass `Config` with fields:

    host: str = "localhost", port: int = 8080, debug: bool = False.

    Include the import. That''s all.

    '
  scoring:
    type: code_exec_python
    tests:
    - from dataclasses import is_dataclass; from typing import get_type_hints; assert
      is_dataclass(Config)
    - c = Config(); assert c.host == 'localhost' and c.port == 8080 and c.debug ==
      False
  max_tokens: 256
  temperature: 0.0
- id: so-19-regex-capture
  prompt: 'Output a JSON object with key "regex" whose value is a regex string

    that matches a valid IPv4 address. Also include key "test_string"

    with value "192.168.1.1". JSON only. No other text.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: json_schema
      schema:
        regex: str
        test_string: str
      required_keys:
      - regex
      - test_string
    - type: contains
      expected: '"192.168.1.1"'
  max_tokens: 256
  temperature: 0.0
- id: so-20-json-error-response
  prompt: 'Output a JSON error response following this exact shape:

    {"error": {"code": "NOT_FOUND", "message": "Resource not found",

    "details": {"resource_id": "abc-123", "request_id": "req-456"}}}.

    The resource_id and request_id values must be strings. JSON only.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: json_schema
      schema:
        error: dict
      required_keys:
      - error
    - type: contains_all
      expected:
      - '"code": "NOT_FOUND"'
      - '"resource_id": "abc-123"'
      - '"request_id": "req-456"'
  max_tokens: 256
  temperature: 0.0
