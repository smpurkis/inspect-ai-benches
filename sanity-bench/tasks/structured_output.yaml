  - id: so-40-json-conditional-nested
    prompt: |
      Output JSON with conditional nesting 3 levels deep. Root keys:
      "type" ("standard"|"premium"), "config" (object). If type is "premium",
      config must include key "features" (array of strings) and "limits"
      (object with "rate" as integer). If type is "standard", config must
      include key "max_users" (integer) but no "features" key.
      Set type to "premium" with at least 2 features and rate: 1000.
      JSON only, no other text.
    scoring:
      type: composite
      mode: all
      parts:
        - {type: json_schema, schema: {type: "str", config: "dict"}, required_keys: ["type", "config"]}
        - {type: regex, pattern: "\"type\"\\s*:\\s*\"premium\""}
        - {type: contains, expected: "\"features\""}
        - {type: contains, expected: "\"rate\": 1000"}
    max_tokens: 384
    temperature: 0.0
