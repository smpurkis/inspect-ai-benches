  - id: so-38-json-patch
    prompt: |
      Output a JSON Patch (RFC 6902) document (no other text). An array of
      operations to transform {"name": "old", "status": "active"} into
      {"name": "new", "status": "active", "version": 2}. Must use exactly
      two operations: one "replace" and one "add". Each operation has "op",
      "path", "value". Output only the JSON array.
    scoring:
      type: composite
      mode: all
      parts:
        - {type: json_schema, schema: {}, required_keys: []}
        - {type: code_exec_python, tests: [
            "import json; patch = json.loads(_output); assert isinstance(patch, list); assert len(patch) == 2",
            "import json; patch = json.loads(_output); ops = [p['op'] for p in patch]; assert 'replace' in ops and 'add' in ops"
          ]}
        - {type: regex, pattern: '"op"\\s*:\\s*"replace"'}
        - {type: regex, pattern: '"op"\\s*:\\s*"add"'}
    max_tokens: 256
    temperature: 0.0

