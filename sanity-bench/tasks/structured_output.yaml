category: structured_output
tasks:
  - id: so-01-simple-json
    prompt: |
      Emit a single JSON object (and nothing else, no commentary, no code fences)
      describing a person with keys: name (string), age (integer), is_member
      (boolean). Use any sensible values.
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "^\\s*\\{", flags: ["S"]}
        - {type: json_schema, schema: {name: "str", age: "int", is_member: "bool"}, required_keys: ["name","age","is_member"]}
    max_tokens: 512
  - id: so-02-array
    prompt: |
      Output a JSON array of three integers in ascending order. Nothing else.
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "^\\s*\\[\\s*-?\\d+\\s*,\\s*-?\\d+\\s*,\\s*-?\\d+\\s*\\]\\s*$"}
    max_tokens: 512
  - id: so-03-nested
    prompt: |
      Output a JSON object with key "user" mapping to an object with keys "id"
      (int) and "tags" (list of strings, length >= 2). No commentary, JSON only.
    scoring:
      type: json_schema
      schema: {user: "dict"}
      required_keys: ["user"]
    max_tokens: 512
  - id: so-04-csv
    prompt: |
      Output CSV with header row "name,quantity,price" and exactly three data
      rows. Use realistic grocery values. Nothing else.
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "^name,quantity,price\\n"}
        - {type: regex, pattern: "(?:[^,\\n]*,[^,\\n]*,[^,\\n]*\\n){3}", flags: ["M"]}
    max_tokens: 512
  - id: so-05-yaml
    prompt: |
      Output a YAML document describing a server with keys: host (string), port
      (int), tls (bool). Nothing else, no code fences.
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "(?m)^host:\\s*\\S"}
        - {type: regex, pattern: "(?m)^port:\\s*\\d+"}
        - {type: regex, pattern: "(?mi)^tls:\\s*(true|false|yes|no)"}
    max_tokens: 512
  - id: so-06-markdown-table
    prompt: |
      Output a markdown table listing the three primary additive colours, one row
      each, with columns "Colour" and "Hex". Use proper hex codes prefixed with
      `#`. No commentary outside the table.
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "\\|\\s*Colou?r\\s*\\|\\s*Hex\\s*\\|", flags: ["I"]}
        - {type: regex, pattern: "#[0-9a-fA-F]{3,6}.*\\n.*#[0-9a-fA-F]{3,6}.*\\n.*#[0-9a-fA-F]{3,6}", flags: ["S"]}
    max_tokens: 512
  - id: so-07-xml
    prompt: |
      Output a single XML element `<book>` with child elements `<title>` and
      `<author>` (any sensible values). No commentary, just the XML.
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "<book>"}
        - {type: regex, pattern: "<title>[^<]+</title>"}
        - {type: regex, pattern: "<author>[^<]+</author>"}
        - {type: regex, pattern: "</book>"}
    max_tokens: 512
  - id: so-08-deeper-json
    prompt: |
      Output JSON only (no other text) representing a TODO list with key "items"
      mapping to a list of objects each with keys "id" (int) and "done" (bool).
      The list must contain exactly 3 items.
    scoring:
      type: composite
      mode: all
      parts:
        - {type: json_schema, schema: {items: "list"}, required_keys: ["items"]}
        - {type: regex, pattern: "\"id\".*\"done\".*\"id\".*\"done\".*\"id\".*\"done\"", flags: ["S"]}
    max_tokens: 512
  - id: so-09-strict-enum
    prompt: |
      Output a JSON object with one key "status" whose value is one of:
      "ok", "warn", "fail". Use "warn". Nothing else.
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "^\\s*(```\\w*\\s*)?\\{\\s*\"status\"\\s*:\\s*\"warn\"\\s*\\}\\s*(```)?\\s*$", flags: ["S"]}
    max_tokens: 512
  - id: so-10-iso-date
    prompt: |
      Output a JSON object with key "date" whose value is an ISO-8601 date string
      (format YYYY-MM-DD) representing 1st March 2025. Nothing else.
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "\"date\"\\s*:\\s*\"2025-03-01\""}
    max_tokens: 512

  - id: so-11-toml
    prompt: |
      Output a TOML config document with a [database] section containing these
      keys: host (string "localhost"), port (integer 5432), name (string "mydb").
      No commentary, no code fences, just the TOML.
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "(?m)^\\[database\\]"}
        - {type: regex, pattern: "(?m)^host\\s*=\\s*\"localhost\""}
        - {type: regex, pattern: "(?m)^port\\s*=\\s*5432"}
        - {type: regex, pattern: "(?m)^name\\s*=\\s*\"mydb\""}
    max_tokens: 512

  - id: so-12-jsonl
    prompt: |
      Output exactly 3 lines of JSONL (one valid JSON object per line). Each
      object must have keys "event" (string) and "ts" (integer timestamp).
      Nothing else.
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "^\\s*\\{[^\\n]+\\}\\n\\{[^\\n]+\\}\\n\\{[^\\n]+\\}", flags: ["S"]}
        - {type: regex, pattern: "\"event\"", flags: ["S"]}
        - {type: regex, pattern: "\"ts\"\\s*:\\s*\\d+", flags: ["S"]}
    max_tokens: 512

  - id: so-13-null-json
    prompt: |
      Output a JSON object with exactly two keys: "found" (boolean false) and
      "result" (null). No other keys. No commentary.
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "\"found\"\\s*:\\s*false"}
        - {type: regex, pattern: "\"result\"\\s*:\\s*null"}
    max_tokens: 256

  - id: so-14-compact-json
    prompt: |
      Output a compact JSON array (no unnecessary whitespace) of exactly two
      objects, each with a single key "x" mapping to a distinct integer.
      Example format: [{"x":1},{"x":2}]
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "^\\s*\\[\\{\"x\":\\d+\\},\\{\"x\":\\d+\\}\\]\\s*$"}
    max_tokens: 256

  - id: so-15-mermaid
    prompt: |
      Output a Mermaid flowchart with exactly 3 nodes (A, B, C) connected as
      A --> B --> C. Start with the line "graph TD". No code fences,
      no commentary.
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "(?m)^graph\\s+TD"}
        - {type: regex, pattern: "A\\s*-->\\s*B"}
        - {type: regex, pattern: "B\\s*-->\\s*C"}
    max_tokens: 512

  - id: so-16-html-list
    prompt: |
      Output an HTML unordered list (<ul>) with exactly 3 <li> items naming the
      three primary additive colours (red, green, blue). No other HTML or text.
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "<ul>", flags: ["I"]}
        - {type: regex, pattern: "</ul>", flags: ["I"]}
        - {type: regex, pattern: "(?i)<li>[^<]*red[^<]*</li>"}
        - {type: regex, pattern: "(?i)<li>[^<]*green[^<]*</li>"}
        - {type: regex, pattern: "(?i)<li>[^<]*blue[^<]*</li>"}
    max_tokens: 512

  - id: so-17-json-desc-array
    prompt: |
      Output a JSON array of exactly 5 integers in strictly descending order.
      Nothing else.
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "^\\s*\\[\\s*-?\\d+\\s*(,\\s*-?\\d+\\s*){4}\\]\\s*$"}
    max_tokens: 256

  - id: so-18-yaml-list
    prompt: |
      Output a YAML list of exactly 4 programming language names using "-" bullet
      syntax. No keys, no extra text, no code fences.
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "(?m)^- \\S"}
        - {type: length_range, min: 4, max: 4, unit: lines}
    max_tokens: 256

  - id: so-19-users-array
    prompt: |
      Output a JSON object with key "users" mapping to an array of exactly
      2 objects, each with keys "id" (integer) and "name" (string).
      JSON only, no commentary.
    scoring:
      type: composite
      mode: all
      parts:
        - {type: json_schema, schema: {users: "list"}, required_keys: ["users"]}
        - {type: regex, pattern: "\"id\"\\s*:\\s*\\d+.*\"name\"\\s*:\\s*\"[^\"]+\"", flags: ["S"]}
        - {type: regex, pattern: "\"id\".*\"id\"", flags: ["S"]}
    max_tokens: 512

  - id: so-20-graphql-query
    prompt: |
      Output a GraphQL query that fetches a user by id (variable $id) and
      requests the fields name and email. Output the query only, no explanation.
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "query|\\{\\s*user"}
        - {type: regex, pattern: "\\$id|id\\s*:"}
        - {type: contains_all, expected: ["name", "email"]}
    max_tokens: 512