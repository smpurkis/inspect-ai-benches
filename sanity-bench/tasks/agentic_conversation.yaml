category: agentic_conversation
tasks:
  - id: ac-01-ci-triage
    prompt: |
      You are an on-call engineer. The CI pipeline has just failed on the main
      branch. List the first 3 diagnostic steps you would take, as a numbered
      list. Be concrete and specific.
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "(?m)^1\\."}
        - {type: regex, pattern: "(?m)^2\\."}
        - {type: regex, pattern: "(?m)^3\\."}
        - {type: contains_any, expected: ["log", "error", "fail", "test", "build", "check"]}
    max_tokens: 512

  - id: ac-02-hotfix-deploy
    prompt: |
      A critical bug has been found in production. Enumerate the steps to deploy
      a hotfix safely, in order. Number each step. Include testing, approval,
      and rollback preparation.
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "(?m)^1\\."}
        - {type: contains_any, expected: ["test", "review", "approve", "rollback"]}
        - {type: contains_any, expected: ["deploy", "release", "merge", "push"]}
        - {type: length_range, min: 4, max: 20, unit: lines}
    max_tokens: 512

  - id: ac-03-slow-api
    prompt: |
      A user reports that the API endpoint /search is slow (>5 s response time).
      What are the first 3 things you investigate? Number each item.
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "(?m)^1\\."}
        - {type: regex, pattern: "(?m)^3\\."}
        - {type: contains_any, expected: ["query", "database", "index", "cache", "log", "profile", "trace", "CPU", "memory"]}
    max_tokens: 512

  - id: ac-04-research-decompose
    prompt: |
      You are an AI agent. The user says: "Research recent advances in mRNA
      vaccines and write a two-page summary."
      Break this into concrete numbered subtasks you would execute to complete
      the request.
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "(?m)^1\\."}
        - {type: contains_any, expected: ["search", "find", "gather", "collect", "read", "review"]}
        - {type: contains_any, expected: ["write", "draft", "summarise", "summarize", "compile"]}
        - {type: length_range, min: 3, max: 20, unit: lines}
    max_tokens: 512

  - id: ac-05-rate-limit-hit
    prompt: |
      Your agent is calling an external API in a loop and receives a 429
      Too Many Requests response. What do you do next? Give a numbered plan
      with at least 3 steps.
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "(?m)^1\\."}
        - {type: contains_any, expected: ["wait", "backoff", "retry", "sleep", "pause", "delay"]}
        - {type: contains_any, expected: ["retry", "resume", "continue", "queue"]}
    max_tokens: 512

  - id: ac-06-git-conflict
    prompt: |
      You are resolving a git merge conflict in a feature branch. List the
      steps to resolve it correctly, numbered. Include at least: identifying
      conflicting files, editing, marking resolved, and completing the merge.
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "(?m)^1\\."}
        - {type: contains_any, expected: ["conflict", "<<<", "marker", "file"]}
        - {type: contains_any, expected: ["commit", "merge", "resolve", "add"]}
    max_tokens: 512

  - id: ac-07-write-unit-tests
    prompt: |
      You need to write unit tests for a new Python function. Describe your
      plan in numbered steps, covering: reading the function spec, identifying
      edge cases, writing the tests, and running them.
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "(?m)^1\\."}
        - {type: contains_any, expected: ["edge case", "boundary", "input", "spec", "docstring"]}
        - {type: contains_any, expected: ["assert", "test", "run", "execute"]}
    max_tokens: 512

  - id: ac-08-data-migration
    prompt: |
      You need to migrate a PostgreSQL database table to a new schema without
      downtime. Outline the steps in numbered order. Include backup, migration
      script, validation, and cutover.
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "(?m)^1\\."}
        - {type: contains_any, expected: ["backup", "dump", "snapshot"]}
        - {type: contains_any, expected: ["test", "validate", "verify", "check"]}
        - {type: contains_any, expected: ["migrate", "cutover", "switch", "rename"]}
    max_tokens: 512

  - id: ac-09-docker-wont-start
    prompt: |
      A Docker container fails to start. List your numbered diagnostic steps,
      starting from the most basic. At least 3 steps.
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "(?m)^1\\."}
        - {type: contains_any, expected: ["log", "logs", "docker logs", "stderr"]}
        - {type: contains_any, expected: ["inspect", "config", "image", "port", "volume", "env"]}
    max_tokens: 512

  - id: ac-10-setup-dev-env
    prompt: |
      Describe the numbered steps to set up a fresh development environment
      for a Python web project from scratch. Include cloning, installing
      dependencies, environment variables, and running tests.
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "(?m)^1\\."}
        - {type: contains_any, expected: ["clone", "git clone"]}
        - {type: contains_any, expected: ["install", "pip", "venv", "poetry", "requirements"]}
        - {type: contains_any, expected: ["test", "pytest", "run"]}
    max_tokens: 512

  - id: ac-11-security-vuln
    prompt: |
      A security researcher has reported an RCE vulnerability in your production
      API. Enumerate your incident response steps in order: triage, fix,
      release, and disclosure. Number each step.
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "(?m)^1\\."}
        - {type: contains_any, expected: ["triage", "assess", "severity", "patch", "fix"]}
        - {type: contains_any, expected: ["disclose", "notify", "communicate", "advisory", "CVE"]}
    max_tokens: 512

  - id: ac-12-email-automation
    prompt: |
      A user asks: "Automate the sorting of my inbox: move newsletters to a
      Newsletter folder and flag emails from my boss as important."
      Break this into numbered implementation steps for building the automation.
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "(?m)^1\\."}
        - {type: contains_any, expected: ["rule", "filter", "condition", "criteria"]}
        - {type: contains_any, expected: ["folder", "label", "move", "flag", "mark"]}
    max_tokens: 512

  - id: ac-13-scale-service
    prompt: |
      Your service is about to scale from 1000 to 100,000 users. What are the
      first 4 areas you assess and address? Give a numbered list.
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "(?m)^1\\."}
        - {type: regex, pattern: "(?m)^4\\."}
        - {type: contains_any, expected: ["database", "cache", "CDN", "load balanc", "queue", "async"]}
    max_tokens: 512

  - id: ac-14-api-integration
    prompt: |
      You need to integrate a third-party payment API into your service. List
      the numbered steps from getting credentials to going live, including
      testing in sandbox mode and error handling.
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "(?m)^1\\."}
        - {type: contains_any, expected: ["credential", "API key", "auth", "token", "sandbox"]}
        - {type: contains_any, expected: ["test", "sandbox", "staging"]}
        - {type: contains_any, expected: ["error", "handle", "webhook", "retry"]}
    max_tokens: 512

  - id: ac-15-csv-cleaning
    prompt: |
      You receive a CSV file with missing values, inconsistent date formats,
      and duplicate rows. List your numbered data-cleaning steps.
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "(?m)^1\\."}
        - {type: contains_any, expected: ["duplicate", "dedup"]}
        - {type: contains_any, expected: ["missing", "null", "NaN", "fill", "drop"]}
        - {type: contains_any, expected: ["date", "format", "parse", "normalise", "normalize"]}
    max_tokens: 512

  - id: ac-16-refactor-plan
    prompt: |
      A 5,000-line Python file needs to be refactored into separate modules.
      Describe the numbered steps you would take, from analysis to testing
      the refactored code.
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "(?m)^1\\."}
        - {type: contains_any, expected: ["analys", "identify", "map", "understand"]}
        - {type: contains_any, expected: ["module", "package", "split", "extract"]}
        - {type: contains_any, expected: ["test", "verify", "regression"]}
    max_tokens: 512

  - id: ac-17-customer-complaint
    prompt: |
      A customer reports they were charged twice for the same order. You are
      the support agent. List the numbered steps to resolve this.
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "(?m)^1\\."}
        - {type: contains_any, expected: ["verify", "check", "confirm", "look up", "investigate"]}
        - {type: contains_any, expected: ["refund", "reimburse", "credit", "resolve"]}
    max_tokens: 512

  - id: ac-18-monitor-setup
    prompt: |
      You need to set up monitoring and alerting for a new web service.
      Outline a numbered plan covering: metrics to collect, alerting thresholds,
      dashboards, and on-call runbooks.
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "(?m)^1\\."}
        - {type: contains_any, expected: ["metric", "latency", "error rate", "throughput", "CPU"]}
        - {type: contains_any, expected: ["alert", "threshold", "notify", "page", "PagerDuty"]}
        - {type: contains_any, expected: ["dashboard", "runbook", "playbook", "Grafana"]}
    max_tokens: 512

  - id: ac-19-dependency-upgrade
    prompt: |
      A critical security patch requires upgrading a major dependency (e.g.
      Django 4 → 5) in a large production application. List your numbered
      upgrade steps, including testing and rollback.
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "(?m)^1\\."}
        - {type: contains_any, expected: ["changelog", "breaking", "migration guide", "diff"]}
        - {type: contains_any, expected: ["test", "CI", "staging"]}
        - {type: contains_any, expected: ["rollback", "revert", "pin"]}
    max_tokens: 512

  - id: ac-20-new-api-key
    prompt: |
      You need to provision and securely deploy a new third-party API key for
      a production service. Enumerate the numbered steps, covering creation,
      storage, deployment, and rotation policy.
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "(?m)^1\\."}
        - {type: contains_any, expected: ["secret", "vault", "env", "environment variable", "secrets manager"]}
        - {type: contains_any, expected: ["rotate", "rotation", "expir", "renew"]}
        - {type: contains_any, expected: ["deploy", "inject", "CI", "pipeline"]}
    max_tokens: 512
