category: instruction_following
tasks:
- id: if-01-json-seven-e-words
  prompt: 'Output a JSON array containing exactly 7 words. Every word must

    contain the letter "e". The array must be on a single line. No

    other text before or after.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: ^\[.*\]$
      flags: []
    - type: regex
      pattern: '[^"e]*e[^"]*","[^"e]*e[^"]*","[^"e]*e[^"]*","[^"e]*e[^"]*","[^"e]*e[^"]*","[^"e]*e[^"]*","[^"e]*e[^"]*"\]$'
    - type: length_range
      min: 1
      max: 1
      unit: lines
  max_tokens: 512
- id: if-02-allcaps-no-a
  prompt: 'Write a paragraph in ALL CAPS about computer processors. No

    punctuation except periods. The letter "a" (uppercase or lowercase)

    may not appear anywhere. Exactly 40 to 60 words.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: ^[^aA]*$
      flags:
      - S
    - type: regex
      pattern: ^[^a-z]*$
      flags:
      - S
    - type: length_range
      min: 40
      max: 60
      unit: words
  max_tokens: 768
- id: if-03-json-single-line
  prompt: 'Output a single-line JSON object with these keys: "name" (string),

    "count" (integer between 1 and 100), "tags" (array of exactly 3

    strings), and "active" (boolean true). No other text.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: json_schema
      schema:
        name: str
        count: int
        tags: list
        active: bool
      required_keys:
      - name
      - count
      - tags
      - active
    - type: regex
      pattern: ^\s*\{[^}]*count[^}]+(?:[1-9]\d?|100)[^}]*\}\s*$
      flags: []
    - type: length_range
      min: 1
      max: 1
      unit: lines
  max_tokens: 512
- id: if-04-pyramid-sentences
  prompt: 'Write exactly 4 lines about time. Line 1: a 3-word sentence.

    Line 2: a 5-word sentence. Line 3: a 7-word sentence.

    Line 4: a 9-word sentence. Each line must end with a period.

    No other text or blank lines.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: ^(\S+\s+){2}\S+\.\n(\S+\s+){4}\S+\.\n(\S+\s+){6}\S+\.\n(\S+\s+){8}\S+\.$
      flags: []
    - type: length_range
      min: 4
      max: 4
      unit: lines
  max_tokens: 512
- id: if-05-vowel-started-languages
  prompt: 'List 5 programming languages. One per line. Each line must begin

    with a different vowel (A, E, I, O, U) followed by ". " then the

    language name. No other text.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: ^A\.\s+\S.*\nE\.\s+\S.*\nI\.\s+\S.*\nO\.\s+\S.*\nU\.\s+\S.*$
      flags:
      - S
    - type: length_range
      min: 5
      max: 5
      unit: lines
  max_tokens: 512
- id: if-06-db-question-constraint
  prompt: 'Write a single sentence about databases that: ends with a question

    mark, contains the word "SQL", is under 15 words, and does not

    contain the letter "a" (case-insensitive).

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: .*\?\s*$
      flags:
      - S
    - type: contains
      expected: SQL
    - type: regex
      pattern: ^[^aA]*$
      flags:
      - S
    - type: length_range
      max: 14
      unit: words
  max_tokens: 384
- id: if-07-exact-yaml
  prompt: "Output this exact YAML document with no code fences and no extra\ntext\
    \ before or after:\nserver:\n  host: \"localhost\"\n  port: 5432\n  features:\n\
    \    - logging\n    - auth\n    - caching\n"
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: '^server:\n  host: "localhost"\n  port: 5432\n  features:\n    - logging\n    -
        auth\n    - caching$'
      flags: []
    - type: length_range
      min: 6
      max: 6
      unit: lines
  max_tokens: 384
- id: if-08-table-sum-100
  prompt: 'Output a 2x2 markdown table with row headers "Row1" and "Row2"

    and column headers "ColA" and "ColB". Each cell must contain a

    single integer. The sum of all four integers must be 100.

    No other text.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: \|\s*Row1\s*\|.*\|\s*Row2\s*\|.*\|
      flags:
      - S
    - type: regex
      pattern: \|\s*ColA\s*\|\s*ColB\s*\|
      flags: []
    - type: regex
      pattern: \|[-:\s|]+\|
      flags: []
  max_tokens: 512
- id: if-09-alphabetical-words
  prompt: 'Write exactly 10 words separated by commas. Every word must start

    with a letter between A and M (case-insensitive). The words must

    be in alphabetical order by first letter. No word may repeat.

    The entire output must be on a single line.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: ^[A-Ma-m]\w+(?:,[A-Ma-m]\w+){9}$
      flags: []
    - type: length_range
      min: 1
      max: 1
      unit: lines
  max_tokens: 512
- id: if-10-layer-count-precision
  prompt: 'Write exactly 4 sentences about neural networks. The word "layer"

    must appear exactly 3 times. The word "neuron" must appear exactly

    once. No sentence may contain the word "network". Each sentence

    must be a complete sentence ending with a period.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: (?i)\blayer\b[\s\S]*?\blayer\b[\s\S]*?\blayer\b
      flags: []
    - type: regex
      pattern: (?i)\bneuron\b
      flags: []
    - type: regex
      pattern: ^(?:(?!\bnetwork\b)[\s\S])*$
      flags:
      - S
    - type: length_range
      min: 4
      max: 4
      unit: sentences
  max_tokens: 512
- id: if-11-python-list-multiples
  prompt: 'Output a Python list literal containing exactly 5 integers. Every

    integer must be a multiple of 7 and between 1 and 100. No other

    text before or after the list. No whitespace between elements.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: ^\[\d+(?:,\d+){4}\]$
      flags: []
  max_tokens: 384
- id: if-12-question-answer-pair
  prompt: 'Write exactly 2 sentences. First sentence: a question starting

    with "What" and ending with "?". Second sentence: starting with

    "It depends" and ending with ".". Each sentence must be at least

    8 words long. No other text.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: ^What\b.*\?\s+It depends\b.*\.\s*$
      flags:
      - S
    - type: length_range
      min: 2
      max: 2
      unit: sentences
  max_tokens: 384
- id: if-13-csv-table
  prompt: 'Output a CSV with exactly 3 columns (Name, Age, Role) and exactly

    2 data rows. Use realistic employee data. No markdown fences, no

    extra text. The CSV must have exactly 3 lines including header.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: ^Name,Age,Role\n\w+,\d+,\w+\n\w+,\d+,\w+$
      flags: []
    - type: length_range
      min: 3
      max: 3
      unit: lines
  max_tokens: 384
- id: if-14-mixed-output
  prompt: 'Output exactly 2 lines. Line 1 must contain: a number that is a

    palindrome, a space, a word that is a palindrome, a space, then

    the prime factorization of 42 separated by asterisks. Line 2 must

    contain only the word "DONE" in uppercase.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: ^\d+\s+\w+\s+\d+(?:\*\d+)+\nDONE$
      flags: []
    - type: length_range
      min: 2
      max: 2
      unit: lines
  max_tokens: 512
- id: if-15-climate-triple
  prompt: 'Write exactly 3 sentences about climate change. Sentence 1 must

    contain the word "temperature". Sentence 2 must contain the word

    "carbon". Sentence 3 must contain the word "policy". Each sentence

    must be at most 15 words. No other text.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: (?i)[^.]*\btemperature\b[^.]*\.\s+[^.]*\bcarbon\b[^.]*\.\s+[^.]*\bpolicy\b[^.]*\.\s*$
      flags: []
    - type: length_range
      min: 3
      max: 3
      unit: sentences
  max_tokens: 512
- id: if-16-abab-rhyme
  prompt: 'Write a 4-line poem in A-B-A-B rhyme scheme about programming.

    Each line must be between 6 and 8 words. No title. No other text

    before or after.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: ^\S[\s\S]*\S$
      flags: []
    - type: length_range
      min: 4
      max: 4
      unit: lines
  max_tokens: 512
- id: if-17-json-word-analysis
  prompt: 'Output a JSON array containing exactly 3 objects. Each object

    must have keys: "word" (a 5-letter string), "vowels" (integer

    count of vowels in the word), and "reversed" (the word reversed).

    No other text. Make each word different.

    '
  scoring:
    type: json_schema
    schema:
      word: str
      vowels: int
      reversed: str
    required_keys:
    - word
    - vowels
    - reversed
  max_tokens: 512
- id: if-18-palindrome-list
  prompt: 'Write exactly 5 lines. Each line must contain exactly one word

    that is a palindrome (reads the same forwards and backwards).

    The palindromes must be in alphabetical order. No other text.

    Each word must be at least 3 letters long.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: ^(?:\w+\n){4}\w+$
      flags: []
    - type: length_range
      min: 5
      max: 5
      unit: lines
  max_tokens: 384
- id: if-19-acrostic-dangerous
  prompt: 'Write a single paragraph where the first letter of each word

    spells "DANGEROUS" in order (D A N G E R O U S). The paragraph

    must be about software security. At least 9 words. Under 50 words.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: ^D\w*\s+A\w*\s+N\w*\s+G\w*\s+E\w*\s+R\w*\s+O\w*\s+U\w*\s+S\w*\b
      flags:
      - S
    - type: length_range
      min: 9
      max: 49
      unit: words
  max_tokens: 384
- id: if-20-balance-positional
  prompt: 'Write exactly 3 sentences about work-life balance. The word

    "balance" must appear as the first word of sentence 1, the last

    word of sentence 2, and somewhere in the middle of sentence 3.

    Each sentence must end with a period.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: ^Balance\b[\s\S]*?\bbalance\.[\s\S]*?\bbalance\b[\s\S]*?\.\s*$
      flags:
      - Si
    - type: length_range
      min: 3
      max: 3
      unit: sentences
  max_tokens: 512
