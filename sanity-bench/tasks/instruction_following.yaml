category: instruction_following
tasks:
  - id: if-01-exact-words
    prompt: |
      Write a sentence about a dog that contains exactly seven words.
    scoring: {type: length_range, min: 7, max: 7, unit: words}
    max_tokens: 768
  - id: if-02-uppercase
    prompt: |
      Write a single short paragraph describing autumn. Every letter in your
      response must be uppercase.
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "^[^a-z]*$"}
        - {type: length_range, min: 20, max: 200, unit: words}
    max_tokens: 768
  - id: if-03-no-letter
    prompt: |
      Write three sentences about coffee. None of them may contain the letter "e"
      (case-insensitive).
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "^[^eE]*$"}
        - {type: regex, pattern: "(?s)\\..*\\..*\\."}
    max_tokens: 768
  - id: if-04-bullet-count
    prompt: |
      List exactly five tips for staying focused while working. Use a markdown
      bullet list with `-` as the bullet marker. Nothing before or after the list.
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "^\\s*-\\s+\\S.*\\n-\\s+\\S.*\\n-\\s+\\S.*\\n-\\s+\\S.*\\n-\\s+\\S", flags: ["M"]}
        - {type: regex, pattern: "(?s)\\A\\s*-\\s+"}
    max_tokens: 768
  - id: if-05-mention-keyword
    prompt: |
      Write a short paragraph (under 100 words) about climate change. The word
      "ocean" must appear exactly three times.
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "(?i)(^|\\W)ocean(\\W|$).*?(^|\\W)ocean(\\W|$).*?(^|\\W)ocean(\\W|$)", flags: ["S"]}
        - {type: length_range, max: 100, unit: words}
    max_tokens: 768
  - id: if-06-json-only
    prompt: |
      Reply with a single JSON object on one line containing exactly the keys
      "name" and "score". `name` should be a string and `score` should be the
      integer 42. Do not include any other text.
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "^\\s*\\{[^\\n]*\\}\\s*$"}
        - {type: json_schema, schema: {name: "str", score: "int"}, required_keys: ["name","score"]}
    max_tokens: 768
  - id: if-07-no-markdown
    prompt: |
      Describe the water cycle in three short sentences. Do not use any markdown
      formatting — no asterisks, hashes, backticks, dashes, or numbered lists.
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "^[^*#`\\-]*$", flags: ["S"]}
        - {type: regex, pattern: "^(?:[^.]*\\.){3}[^.]*$", flags: ["S"]}
    max_tokens: 768
  - id: if-08-numbered-only
    prompt: |
      List three benefits of exercise as a numbered list ("1.", "2.", "3."). Each
      benefit must be a single sentence under 12 words. No other text.
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "^\\s*1\\.\\s+\\S.*\\n2\\.\\s+\\S.*\\n3\\.\\s+\\S.*$", flags: ["S"]}
    max_tokens: 768
  - id: if-09-end-with
    prompt: |
      Write a one-paragraph description of a quiet morning. The paragraph must end
      with the exact sentence: "And then the kettle whistled."
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "And then the kettle whistled\\.\\s*$"}
    max_tokens: 768
  - id: if-10-words-start
    prompt: |
      Write a sentence about the sea where every word starts with the letter "s"
      (case-insensitive).
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "^\\s*([sS][^\\s.,;:!?]*[\\s.,;:!?]+)+\\s*$"}
    max_tokens: 768
  - id: if-11-no-punct
    prompt: |
      Write three sentences about coffee. Do not use any punctuation other than
      single spaces (no periods, commas, question marks, exclamation marks,
      hyphens, colons, semicolons, apostrophes, or quotation marks).
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "^[A-Za-z0-9 \\n]+$", flags: ["S"]}
        - {type: length_range, min: 10, unit: words}
    max_tokens: 512

  - id: if-12-line-len
    prompt: |
      List four advantages of bicycles. One per line, each line beginning with
      "* " and being at most 8 words long. Nothing before, nothing after.
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "^\\*\\s+\\S.*\\n\\*\\s+\\S.*\\n\\*\\s+\\S.*\\n\\*\\s+\\S.*\\s*$"}
        - {type: length_range, min: 4, max: 5, unit: lines}
    max_tokens: 512

  - id: if-13-repeat
    prompt: |
      Write a short paragraph (50-80 words) about gardening. The word
      "soil" must appear exactly twice, and the word "water" exactly twice.
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "(?i)\\bsoil\\b[\\s\\S]*?\\bsoil\\b"}
        - {type: regex, pattern: "(?i)\\bwater\\b[\\s\\S]*?\\bwater\\b"}
        - {type: length_range, min: 40, max: 100, unit: words}
    max_tokens: 512

  - id: if-14-prefix-suffix
    prompt: |
      Write a single sentence that starts with the word "Curiously" and ends
      with the word "yesterday." (with a period).
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "^Curiously\\b"}
        - {type: regex, pattern: "yesterday\\.\\s*$"}
    max_tokens: 256

  - id: if-15-roman-numerals
    prompt: |
      List the first five even positive integers. Format each as a Roman
      numeral, one per line, prefixed with "- ". Nothing else.
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "^-\\s*II\\s*$", flags: ["M"]}
        - {type: regex, pattern: "^-\\s*IV\\s*$", flags: ["M"]}
        - {type: regex, pattern: "^-\\s*VI\\s*$", flags: ["M"]}
        - {type: regex, pattern: "^-\\s*VIII\\s*$", flags: ["M"]}
        - {type: regex, pattern: "^-\\s*X\\s*$", flags: ["M"]}
    max_tokens: 384

  - id: if-16-each-line-letter
    prompt: |
      Write four lines, each containing exactly one word, and each word
      starting with a different vowel (A, E, I, O — in that order).
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "^[Aa]\\w*\\s*\\n[Ee]\\w*\\s*\\n[Ii]\\w*\\s*\\n[Oo]\\w*\\s*$"}
    max_tokens: 256

  - id: if-17-yaml-only
    prompt: |
      Emit exactly this YAML document and nothing else (no preamble, no fence):

      version: 1
      enabled: true
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "^\\s*version:\\s*1\\s*\\nenabled:\\s*true\\s*$", flags: ["S"]}
    max_tokens: 256

  - id: if-18-double-space
    prompt: |
      Write a single sentence about the sea. Separate every word with exactly
      two spaces, not one. End with a single full stop.
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "^\\S+(  \\S+){4,}\\.$"}
    max_tokens: 256

  - id: if-19-mixed-constraints
    prompt: |
      Write exactly three sentences about a clock. Each sentence must contain
      the word "tick". No sentence may contain the letter "z". End with the
      sentence "Time runs forward." (exact phrasing).
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "(?i)(tick[\\s\\S]*?tick[\\s\\S]*?tick)"}
        - {type: regex, pattern: "^[^zZ]*$", flags: ["S"]}
        - {type: regex, pattern: "Time runs forward\\.\\s*$"}
    max_tokens: 384

  - id: if-20-table
    prompt: |
      Output a 2-column markdown table with header columns "Item" and "Cost",
      followed by exactly 2 data rows. Nothing else. Use realistic stationery
      item names and £-prefixed costs.
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "\\|\\s*Item\\s*\\|\\s*Cost\\s*\\|"}
        - {type: regex, pattern: "\\|[-\\s|]+\\|"}
        - {type: regex, pattern: "(?s)\\|[^|]+\\|[^|\\n]*£\\d"}
    max_tokens: 384
