category: writing
tasks:
  - id: wri-01-summarize
    prompt: |
      Summarise the following passage in exactly one sentence under 25 words.

      "Photosynthesis is a process used by plants and other organisms to convert
      light energy into chemical energy that, through cellular respiration, can
      later be released to fuel the organisms' activities. Some of this chemical
      energy is stored in carbohydrate molecules, such as sugars and starches,
      which are synthesised from carbon dioxide and water."
    scoring:
      type: composite
      mode: all
      parts:
        - {type: length_range, min: 5, max: 25, unit: words}
        - {type: contains_any, expected: ["light", "energy", "convert", "chemical"]}
    max_tokens: 768
  - id: wri-02-rephrase
    prompt: |
      Rephrase this sentence in plain English (avoid jargon, under 20 words):

      "We are operationalising a paradigm shift in stakeholder synergy to leverage
      cross-functional touchpoints."
    scoring:
      type: composite
      mode: all
      parts:
        - {type: length_range, max: 20, unit: words}
        - {type: regex, pattern: "(?i)(?!.*operationali[sz]ing)(?!.*paradigm)(?!.*synerg)(?!.*touchpoint)", flags: ["S"]}
    max_tokens: 768
  - id: wri-03-tone
    prompt: |
      Rewrite the following angry message as a polite, professional one. Keep the
      essential request. Keep it under 60 words.

      "I CAN'T BELIEVE YOU MESSED UP THE INVOICE AGAIN. FIX IT TODAY OR I'M
      TAKING MY BUSINESS ELSEWHERE."
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "^[^!]*$", flags: ["S"]}
        - {type: contains_any, expected: ["invoice", "billing", "statement"]}
        - {type: contains_any, expected: ["please", "could you", "would you", "appreciate", "kindly"]}
        - {type: length_range, max: 60, unit: words}
    max_tokens: 768
  - id: wri-04-headline
    prompt: |
      Write a single news-style headline (≤10 words) summarising this article
      lead: "Researchers at Cambridge announced today that they have developed a
      cheap, biodegradable battery for medical implants that lasts ten years."
    scoring:
      type: composite
      mode: all
      parts:
        - {type: length_range, max: 10, unit: words}
        - {type: contains_any, expected: ["battery", "implant"]}
    max_tokens: 768
  - id: wri-05-bullet-summary
    prompt: |
      Summarise this in exactly three bullet points (use "-"), one short sentence each:

      "The new tax bill increases the VAT rate from 20% to 22%, raises the
      personal allowance to £15,000, and introduces a windfall tax on energy
      profits over £500m. It also reduces corporation tax by 1%."
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "^\\s*-\\s+[^\\n]+\\n-\\s+[^\\n]+\\n-\\s+[^\\n]+\\s*$"}
    max_tokens: 768
  - id: wri-06-fact-correct
    prompt: |
      Find and correct any factual errors in the following sentence. Output only
      the corrected sentence with no commentary.

      "Mount Everest, the tallest mountain on Earth, is located in the Andes."
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "(?i)(himalaya|nepal|tibet)"}
        - {type: regex, pattern: "(?i)(?!.*andes)"}
    max_tokens: 768
  - id: wri-07-elaborate
    prompt: |
      Expand this single sentence into a vivid 3-sentence description, keeping the
      same meaning:

      "She walked home in the rain."
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "(?:[^.]*\\.\\s*){3}"}
        - {type: contains_any, expected: ["rain", "wet", "drizzl", "downpour", "shower"]}
    max_tokens: 768
  - id: wri-08-merge
    prompt: |
      Merge these two short sentences into one fluent sentence (≤30 words):

      "The meeting was cancelled. The CEO had food poisoning."
    scoring:
      type: composite
      mode: all
      parts:
        - {type: length_range, max: 30, unit: words}
        - {type: regex, pattern: "^[^.\\n]*\\.[^.\\n]*$"}
    max_tokens: 768
  - id: wri-09-letter-style
    prompt: |
      Write a 2-3 sentence apology email to a customer whose order arrived late.
      Be specific about acknowledging the delay and offering a 10% refund.
      Open with "Hi" and sign off with "Best regards,".
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "^Hi\\b"}
        - {type: regex, pattern: "Best regards,"}
        - {type: contains_any, expected: ["delay", "late", "arriv"]}
        - {type: contains_any, expected: ["10%", "ten percent", "refund"]}
    max_tokens: 768
  - id: wri-10-translate-tone
    prompt: |
      Rewrite this casual text as a formal email body (no greeting/signature),
      keeping all factual content. Under 60 words.

      "yo, the server's down again. john rebooted it but it crashed in 5 min.
      probs the memory leak we talked about. need to escalate to ops."
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "(?i)(?!.*\\byo\\b)(?!.*\\bprobs\\b)", flags: ["S"]}
        - {type: contains_any, expected: ["server", "rebooted", "memory", "operations", "ops"]}
        - {type: length_range, max: 60, unit: words}
    max_tokens: 768
  - id: wri-11-tldr
    prompt: |
      Write a "TL;DR:" line (under 20 words) for the following text. Output
      ONLY the line starting with "TL;DR:".

      "Cycling to work has become more popular in many cities after recent
      investments in protected bike lanes, with health, environmental and
      cost-saving benefits cited."
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "^TL;DR:\\s+\\S"}
        - {type: length_range, max: 20, unit: words}
    max_tokens: 256

  - id: wri-12-passive
    prompt: |
      Rewrite this passive-voice sentence in active voice. Output just the
      rewritten sentence.

      "The cake was baked by Maria for the school fair."
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "^Maria"}
        - {type: contains_any, expected: ["baked", "made"]}
    max_tokens: 128

  - id: wri-13-acronyms
    prompt: |
      Rewrite this email so every acronym is spelled out the first time it
      appears (acronym in parentheses after). Keep all other content. Output
      just the rewritten email body.

      "Please confirm the API and SLA before COB on Tuesday. CTO will review."
    scoring:
      type: composite
      mode: all
      parts:
        - {type: contains, expected: "Application Programming Interface"}
        - {type: regex, pattern: "(?i)Service Level Agreement.*\\(SLA\\)"}
        - {type: contains, expected: "Chief Technology Officer"}
    max_tokens: 384

  - id: wri-14-actions
    prompt: |
      Summarise this transcript as exactly three "Action: ..." bullet points
      (use "- "). Each must include a name and a day. Nothing else.

      Transcript: "Alice will draft the budget by Friday. Bob will book the
      venue by Monday. Carol agreed to circulate the agenda before Wednesday."
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "(?mi)^-\\s+Action:.*Alice.*Friday"}
        - {type: regex, pattern: "(?mi)^-\\s+Action:.*Bob.*Monday"}
        - {type: regex, pattern: "(?mi)^-\\s+Action:.*Carol.*Wednesday"}
    max_tokens: 384

  - id: wri-15-clarify
    prompt: |
      Rewrite this run-on sentence as two clear sentences, ≤25 words total.
      Output just the rewrite.

      "The deployment failed because the migration didn't apply because the
      database role lacked permissions because the secrets file hadn't been
      updated for the new environment."
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "(?:[^.]*\\.\\s*){2}"}
        - {type: length_range, max: 28, unit: words}
        - {type: contains_any, expected: ["deployment", "migration", "permissions", "secrets"]}
    max_tokens: 256

  - id: wri-16-impersonal
    prompt: |
      Convert this first-person customer review into an impersonal,
      third-person product description (≤30 words). Output just the
      description.

      "I love this kettle — it boils fast and the lid never gets stuck."
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "^((?!\\bI\\b|\\bmy\\b|\\bme\\b).)*$", flags: ["S"]}
        - {type: length_range, max: 32, unit: words}
    max_tokens: 256

  - id: wri-17-numbers
    prompt: |
      Rewrite the following sentence with every digit-form number replaced by
      its English word form. Output just the rewrite.

      "The 3 dogs caught 12 balls in 5 minutes."
    scoring:
      type: composite
      mode: all
      parts:
        - {type: contains, expected: "three"}
        - {type: contains, expected: "twelve"}
        - {type: contains, expected: "five"}
        - {type: regex, pattern: "^[^0-9]*$", flags: ["S"]}
    max_tokens: 256

  - id: wri-18-plain
    prompt: |
      Rephrase this dense engineering sentence in plain English suitable for
      a junior intern (≤30 words). Output just the rewrite.

      "The non-deterministic flakiness in the integration suite stems from a
      race condition between the message broker and the worker pool's prefetch
      counter."
    scoring:
      type: composite
      mode: all
      parts:
        - {type: length_range, max: 35, unit: words}
        - {type: regex, pattern: "(?i)(?!.*non-deterministic)(?!.*prefetch counter)", flags: ["S"]}
        - {type: contains_any, expected: ["race", "timing", "order", "queue"]}
    max_tokens: 256

  - id: wri-19-internal
    prompt: |
      Convert this customer-friendly support reply into one suitable for
      internal engineering — 1-2 sentences, technical and direct. Output
      just the rewrite.

      "We're really sorry, but it looks like your account got into a weird
      state. We've kicked it back to normal and you should be good to go!"
    scoring:
      type: composite
      mode: all
      parts:
        - {type: length_range, max: 40, unit: words}
        - {type: regex, pattern: "(?i)account[^\\n]*(state|reset|stale)"}
    max_tokens: 256

  - id: wri-20-cite
    prompt: |
      Add an in-line citation in (Author, Year) format after the relevant
      sentence. Use the most plausible author: Albert Einstein, published
      1905. Output just the modified sentence.

      "The theory of special relativity introduced the equivalence of mass
      and energy."
    scoring:
      type: regex
      pattern: "\\(\\s*Einstein,\\s*1905\\s*\\)"
    max_tokens: 256
