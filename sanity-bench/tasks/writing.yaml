category: writing
tasks:
- id: wri-01-plain-english-1000
  prompt: 'Rewrite this using only the 1000 most common English words (no jargon):

    "The asynchronous microservice architecture exhibits quadratic complexity

    degradation under sustained cache-miss conditions due to lock contention."

    ≤25 words.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: length_range
      max: 28
      unit: words
    - type: contains
      expected: slow
    - type: contains
      expected: service
  max_tokens: 384
  temperature: 0.4
- id: wri-02-socratic-dialogue
  prompt: 'Rewrite this argument as a Socratic dialogue (Socrates and Student, 4 exchanges):

    "The high cost of pharmaceutical drugs is justified by R&D investment."

    Each line: start with "Socrates:" or "Student:". No other text.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: '(?m)^Socrates:'
    - type: regex
      pattern: '(?m)^Student:'
    - type: length_range
      min: 8
      max: 12
      unit: lines
  max_tokens: 768
  temperature: 0.5
- id: wri-03-spec-haiku
  prompt: 'Translate this spec into a haiku (5-7-5) that preserves all constraints:

    "The system shall encrypt all data at rest using AES-256 and in transit

    using TLS 1.3, with keys rotated every 90 days."

    No title, no commentary.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: length_range
      min: 3
      max: 3
      unit: lines
    - type: contains_all
      expected:
      - encrypt
      - key
    - type: contains_any
      expected:
      - AES
      - TLS
      - rotate
  max_tokens: 384
  temperature: 0.4
- id: wri-04-email-to-exec
  prompt: 'Condense this into a 1-sentence email to a CEO (≤20 words, no jargon):

    "Our CDN provider had a cascading failure across three Points of Presence

    that increased TTFB by 3400ms, affecting 68% of NA traffic from 14:02 to

    14:47 UTC. Failover to the secondary provider reduced impact after 12 minutes."

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: length_range
      max: 20
      unit: words
    - type: contains_any
      expected:
      - slow
      - down
      - issue
      - delay
      - problem
  max_tokens: 256
  temperature: 0.4
- id: wri-05-correct-and-enhance
  prompt: 'The following has exactly ONE factual error. Find it, correct it, then

    rewrite the paragraph as a compelling 2-sentence marketing blurb.

    "Mount Everest is 8,848 meters tall and sits on the border of Nepal and

    India. It was first summited by Sir Edmund Hillary and Tenzing Norgay in

    1953."

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: contains
      expected: China
    - type: contains_any
      expected:
      - summit
      - peak
      - Everest
      - 8,848
      - 8,849
    - type: length_range
      min: 2
      max: 4
      unit: sentences
  max_tokens: 384
  temperature: 0.4
- id: wri-06-multi-rewrite
  prompt: 'Apply ALL three transformations to this sentence simultaneously:

    "Our AI leverages NLP to optimize customer journey touchpoints."

    1. Remove all tech buzzwords  2. Convert to active voice  3. Reduce to ≤12 words.

    Output ONLY the rewritten sentence.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: ^(?!(?:.*\bAI\b|.*\bleverage\b|.*\boptimize\b|.*\btouchpoint\b)).*$
      flags:
      - I
      - S
    - type: length_range
      max: 14
      unit: words
  max_tokens: 256
  temperature: 0.4
- id: wri-07-two-audiences
  prompt: 'Explain "why the database replication lag spiked" in two versions:

    Version A (to a product manager, ≤20 words, no tech terms)

    Version B (to a senior engineer, ≤20 words, must include: WAL, replica, sync)

    Separate with "---". No headers.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: contains_all
      expected:
      - WAL
      - replica
      - sync
    - type: contains
      expected: '---'
    - type: length_range
      max: 50
      unit: words
  max_tokens: 512
  temperature: 0.4
- id: wri-08-legal-to-plain
  prompt: 'Rewrite this EULA clause so a 12-year-old can understand it. ≤50 words.

    "The Licensor grants the Licensee a non-exclusive, non-transferable,

    revocable license to use the Software solely for internal business

    purposes, subject to the terms herein."

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: length_range
      max: 55
      unit: words
    - type: regex
      pattern: ^(?!(?:.*\bLicensor\b|.*\bLicensee\b|.*\bnon-exclusive\b)).*$
      flags:
      - I
      - S
  max_tokens: 384
  temperature: 0.4
- id: wri-09-tweet-thread
  prompt: 'Summarise the paper''s core finding as a 3-tweet thread.

    Tweet 1: The finding (≤140 chars)

    Tweet 2: Why it matters (≤140 chars)

    Tweet 3: One actionable takeaway (≤140 chars)

    "Study: Sleep deprivation reduces cognitive performance by 30%, but

    most subjects believed they performed normally."

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: length_range
      min: 3
      max: 6
      unit: lines
    - type: contains
      expected: sleep
    - type: contains
      expected: 30%
  max_tokens: 512
  temperature: 0.4
- id: wri-10-rhetorical-devices
  prompt: 'Rewrite this claim using ALL THREE rhetorical devices: chiasmus, anaphora,

    and epistrophe. ≤40 words total.

    "Fast code is not always correct code."

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: contains
      expected: code
    - type: length_range
      max: 45
      unit: words
  max_tokens: 384
  temperature: 0.5
- id: wri-11-xyz-spellout
  prompt: 'Rewrite this sentence replacing every initialism/acronym with its full
    form.

    "The QA team found the MVP had SQLi in the JWT auth. PM escalated to CTO."

    Output only the rewritten sentence.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: contains_all
      expected:
      - Quality Assurance
      - Minimum Viable Product
    - type: contains_all
      expected:
      - SQL injection
      - JSON Web Token
    - type: contains_all
      expected:
      - Product Manager
      - Chief Technology Officer
  max_tokens: 384
  temperature: 0.3
- id: wri-12-persuade-skeptic
  prompt: 'Write a 3-sentence rebuttal to: "Code comments are unnecessary if the code

    is readable." Each sentence must start with "First,", "Second,", "Third,".

    Be persuasive, not aggressive.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: ^First,.*\nSecond,.*\nThird,
      flags:
      - S
    - type: length_range
      min: 3
      max: 5
      unit: sentences
  max_tokens: 384
  temperature: 0.5
- id: wri-13-complex-chart-caption
  prompt: 'Write a figure caption for this chart (≤30 words). Include both a trend

    summary AND a caveat. Use "although" in the sentence.

    "Chart: Q1 revenue $12M, Q2 $14M, Q3 $11M, Q4 $18M."

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: contains
      expected: although
    - type: length_range
      max: 32
      unit: words
    - type: contains_any
      expected:
      - revenue
      - quarter
      - trend
      - growth
  max_tokens: 256
  temperature: 0.4
- id: wri-14-context-collapse
  prompt: 'You are handed a Slack thread mid-conversation. The first message is lost.

    Reconstruct it from context: the rest is "That doesn''t work with Kubernetes

    1.28" and "So we should pin the version?". Write the most likely first

    message (≤25 words) as a single sentence.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: length_range
      max: 28
      unit: words
    - type: contains_any
      expected:
      - Kubernetes
      - version
      - upgrade
      - update
      - compat
    - type: regex
      pattern: \?
  max_tokens: 256
  temperature: 0.5
- id: wri-15-merge-three
  prompt: 'Merge these three sentences into one fluent sentence (≤25 words, no semicolons):

    A: The API rate limit was exceeded.

    B: The client received a 429 status code.

    C: Retry-after was set to 30 seconds.

    Output only the merged sentence.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: ^[^;]*$
      flags:
      - S
    - type: length_range
      max: 27
      unit: words
    - type: contains_all
      expected:
      - rate limit
      - '429'
      - seconds
  max_tokens: 256
  temperature: 0.3
- id: wri-16-speedrun-writeup
  prompt: 'Write a 4-line changelog entry for a critical security patch.

    Line 1: "## [1.3.2] - 2024-11-15"

    Line 2: severity and CVE ID

    Line 3: what was vulnerable

    Line 4: what the fix does

    Use realistic CVE format (CVE-YYYY-NNNNN). No other text.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: '## \[1\.3\.2\] - 2024-11-15'
    - type: regex
      pattern: CVE-\d{4}-\d+
    - type: length_range
      min: 4
      max: 5
      unit: lines
  max_tokens: 256
  temperature: 0.4
- id: wri-17-parallel-structure
  prompt: 'Rewrite this so every item in the list uses parallel grammatical structure:

    "Our system offers: 1. fast deployment, 2. it scales easily, 3. monitoring."

    Use exactly "1. [gerund phrase]" / "2. [gerund phrase]" / "3. [gerund phrase]".

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: (?im)1\.\s*\w+ing\s+
    - type: regex
      pattern: (?im)2\.\s*\w+ing\s+
    - type: regex
      pattern: (?im)3\.\s*\w+ing\s+
  max_tokens: 256
  temperature: 0.3
- id: wri-18-stakeholder-matrix
  prompt: 'Convert this into a stakeholder communication matrix (exactly 3 rows):

    Group | Message | Channel | Frequency

    "Developers need to know about the API deprecation. Executives care about

    revenue impact. Customers just want to know if their data is safe."

    Use pipe-separated format. No other text.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: contains
      expected: Group | Message | Channel | Frequency
    - type: regex
      pattern: \n[^|]+\|[^|]+\|[^|]+\|[^|]+\n[^|]+\|[^|]+\|[^|]+\|[^|]+\n[^|]+\|[^|]+\|[^|]+\|[^|]+
  max_tokens: 384
  temperature: 0.4
- id: wri-19-six-hats
  prompt: 'Respond to "We should rewrite the frontend in Rust" using De Bono''s Six

    Thinking Hats. Output exactly 6 lines. Each: "White hat:" / "Red hat:" /

    "Black hat:" / "Yellow hat:" / "Green hat:" / "Blue hat:". One sentence each.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: contains_all
      expected:
      - 'White hat:'
      - 'Red hat:'
      - 'Black hat:'
      - 'Yellow hat:'
      - 'Green hat:'
      - 'Blue hat:'
    - type: length_range
      min: 6
      max: 8
      unit: lines
  max_tokens: 512
  temperature: 0.5
- id: wri-20-minimal-repro
  prompt: 'Write a minimal reproducible bug report from this description (4 sections,
    each

    exactly one line):

    "The app crashes when uploading PNG files larger than 5MB."

    Sections: "## Environment" / "## Steps" / "## Expected" / "## Actual".

    Steps must be numbered 1-3. No other text.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: contains_all
      expected:
      - '## Environment'
      - '## Steps'
      - '## Expected'
      - '## Actual'
    - type: regex
      pattern: '## Steps[^#]*1\.[^#]*2\.[^#]*3\.'
      flags:
      - S
    - type: length_range
      min: 4
      max: 8
      unit: lines
  max_tokens: 384
  temperature: 0.4
