category: structured_synthesis
tasks:
- id: ss-01-caching-strategies
  prompt: 'Compare 5 caching strategies (write-through, write-back, write-

    around, cache-aside, read-through) across 4 axes: data staleness,

    write latency, implementation complexity, and failure resilience.

    Output a markdown table with columns "Strategy" | "Staleness" |

    "Write Latency" | "Complexity" | "Resilience". Then a 1-sentence

    recommendation starting "Best general-purpose:" on a new line.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: contains_all
      expected:
      - write-through
      - write-back
      - write-around
      - cache-aside
      - read-through
    - type: regex
      pattern: 'Best general-purpose:'
    - type: regex
      pattern: \|.*Strategy.*\|.*Staleness.*\|
    - type: regex
      pattern: \|[-:\s|]+\|
  max_tokens: 1024
  temperature: 0.3
- id: ss-02-tcp-congestion
  prompt: 'Trace the causal chain from a TCP sender increasing its window to

    potential congestion collapse. Numbered steps 1-6 covering:

    window growth, queue buildup, packet loss, retransmission, further

    window growth, and throughput collapse. Each step: one sentence

    of at most 15 words. Begin: "1. Sender increases congestion window."

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: ^1\. Sender increases congestion window\.
    - type: regex
      pattern: (?m)^[1-6]\.
    - type: contains_all
      expected:
      - window
      - loss
      - retransmission
      - queue
  max_tokens: 512
  temperature: 0.3
- id: ss-03-swot-architecture
  prompt: 'Apply the SWOT framework to compare monolithic vs microservices

    architecture. Output a 2x4 markdown table: rows "Monolith" and

    "Microservices"; columns "Strengths" | "Weaknesses" | "Opportunities"

    | "Threats". Each cell: 1-2 sentences. Then a new line: "Better for

    startups:" followed by your choice.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: contains_all
      expected:
      - SWOT
      - Monolith
      - Microservices
    - type: regex
      pattern: Strengths.*Weaknesses.*Opportunities.*Threats
    - type: regex
      pattern: 'Better for startups:'
    - type: regex
      pattern: \|[-:\s|]+\|
  max_tokens: 1024
  temperature: 0.3
- id: ss-04-saturated-fat-synthesis
  prompt: 'Synthesize the contradictory research on saturated fat and heart

    disease. Output 2 paragraphs separated by "---". Para 1: evidence

    linking saturated fat to CVD (cite at least Ancel Keys and the

    Seven Countries Study). Para 2: evidence questioning this link

    (cite recent meta-analyses). Then a 1-sentence balanced conclusion.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: contains_all
      expected:
      - saturated
      - Keys
      - Seven Countries
    - type: regex
      pattern: '---'
    - type: contains_any
      expected:
      - meta-analysis
      - CVD
      - LDL
      - HDL
      - cardiovascular
    - type: length_range
      min: 4
      max: 8
      unit: sentences
  max_tokens: 1024
  temperature: 0.5
- id: ss-05-nosql-comparison
  prompt: 'Compare 6 NoSQL database types (document, key-value, column-

    family, graph, time-series, and vector) across 3 axes: data model,

    query pattern, and primary use case. Output a 6-row markdown table

    with columns "Type" | "Data Model" | "Query Pattern" | "Use Case".

    Then a 1-sentence answer: "Best for real-time analytics:" on a

    new line.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: contains_all
      expected:
      - document
      - key-value
      - graph
      - time-series
      - vector
    - type: regex
      pattern: 'Best for real-time analytics:'
    - type: regex
      pattern: \\|.*Type.*\\|.*Data Model.*\\|
  max_tokens: 1024
  temperature: 0.3
- id: ss-06-cdn-causal-chain
  prompt: 'Trace the full causal chain of how a CDN accelerates web content

    delivery. Numbered steps 1-5: DNS routing to edge, cache hit/miss

    logic, origin shield, TCP optimization at edge, and connection

    reuse. Each step: start with an active verb and be at most 12

    words. Begin: "1. Route user to nearest edge."

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: ^1\. Route user to nearest edge\.
    - type: regex
      pattern: (?m)^[1-5]\.
    - type: contains_all
      expected:
      - edge
      - cache
      - origin
      - TCP
  max_tokens: 512
  temperature: 0.3
- id: ss-07-graph-vs-relational-tco
  prompt: 'Perform a TCO (Total Cost of Ownership) analysis comparing a graph

    database (Neo4j) vs a relational database (PostgreSQL) for a social

    network feature: friend-of-friend recommendations. Output a 4-row

    table with columns "Cost Factor" | "Graph DB" | "Relational DB".

    Rows: Licensing, Infrastructure, Query complexity, Developer

    productivity. Then 1-sentence verdict starting "TCO verdict:".

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: contains_all
      expected:
      - TCO
      - Neo4j
      - PostgreSQL
      - friend
    - type: regex
      pattern: 'TCO verdict:'
    - type: contains_any
      expected:
      - Licensing
      - Infrastructure
      - productivity
  max_tokens: 1024
  temperature: 0.3
- id: ss-08-quantum-misconceptions
  prompt: 'Identify and correct 3 common misconceptions about quantum

    computing that even experts sometimes debate. Number them 1-3.

    For each: state the misconception in quotes, then explain why

    it is wrong in 1-2 sentences. Then one sentence starting

    "Consensus:" stating the expert-agreed position.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: (?m)^[1-3]\.
    - type: regex
      pattern: 'Consensus:'
    - type: contains_all
      expected:
      - qubit
      - superposition
      - entanglement
    - type: contains
      expected: '"'
  max_tokens: 768
  temperature: 0.3
- id: ss-09-orchestrators-compare
  prompt: 'Compare Kubernetes, Nomad, and Docker Swarm across 5 dimensions:

    scheduling, networking, scaling, learning curve, and production

    readiness. Output a 5-row markdown table: columns "Dimension" |

    "Kubernetes" | "Nomad" | "Swarm". Then a 1-sentence recommendation

    for a 10-person startup. No other text.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: contains_all
      expected:
      - Kubernetes
      - Nomad
      - Swarm
    - type: regex
      pattern: \\|.*Dimension.*\\|
    - type: regex
      pattern: \\|[-:\s|]+\\|
    - type: contains_any
      expected:
      - scheduling
      - networking
      - scaling
      - learning curve
  max_tokens: 1024
  temperature: 0.3
- id: ss-10-dns-lookup-chain
  prompt: 'Trace the full DNS resolution chain for https://www.example.com

    when no record is cached. Numbered steps 1-8: browser cache,

    OS cache, hosts file, recursive resolver, root, TLD, authoritative,

    response propagation. Each step: ≤10 words, start with active verb.

    Begin: "1. Check browser DNS cache."

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: ^1\. Check browser DNS cache\.
    - type: regex
      pattern: (?m)^[1-8]\.
    - type: contains_all
      expected:
      - root
      - TLD
      - authoritative
      - recursive
  max_tokens: 512
  temperature: 0.3
- id: ss-11-rice-prioritization
  prompt: 'Apply the RICE prioritization framework to 4 hypothetical features:

    Feature A (high reach, medium impact), Feature B (low reach, high

    impact), Feature C (medium reach, medium impact, high confidence),

    Feature D (high reach, high impact, low confidence). Output a

    4-row markdown table with columns "Feature" | "Reach" | "Impact"

    | "Confidence" | "Effort" | "RICE Score" using reasonable

    hypothetical values. Then rank them. No other text.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: contains_all
      expected:
      - RICE
      - Reach
      - Impact
      - Confidence
      - Effort
    - type: regex
      pattern: \\|[-:\s|]+\\|
    - type: length_range
      min: 5
      max: 12
      unit: lines
  max_tokens: 768
  temperature: 0.3
- id: ss-12-acid-base-new-sql
  prompt: 'Compare ACID, BASE, and NewSQL across 5 dimensions: consistency

    model, availability, partition tolerance, scalability, and use

    cases. Output a 5-row markdown table with columns "Dimension" |

    "ACID" | "BASE" | "NewSQL". Then a 1-sentence answer: "Best for

    financial transactions:" followed by your choice.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: contains_all
      expected:
      - ACID
      - BASE
      - NewSQL
    - type: regex
      pattern: 'Best for financial transactions:'
    - type: contains_any
      expected:
      - consistency
      - availability
      - partition
      - scalability
  max_tokens: 1024
  temperature: 0.3
- id: ss-13-memory-leak-chain
  prompt: 'Trace the causal chain from a memory leak to an OOM kill in a

    Linux process. Numbered steps 1-6: allocation without free, heap

    growth, swapping, OOM score increase, kernel invocation of OOM

    killer, process termination. Each step: ≤12 words, start with a

    verb. Begin: "1. Allocate memory without freeing."

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: ^1\. Allocate memory without freeing\.
    - type: regex
      pattern: (?m)^[1-6]\.
    - type: contains_all
      expected:
      - heap
      - swap
      - OOM
      - termination
  max_tokens: 512
  temperature: 0.3
- id: ss-14-ml-model-decision-matrix
  prompt: 'Compare 5 ML model types (linear regression, decision tree,

    random forest, SVM, neural network) across 5 axes: interpretability,

    training speed, handles non-linearity, data efficiency, and overfit

    tendency. Output a 5-row markdown table: columns "Model" | "Interp."

    | "Speed" | "Non-linear" | "Data Eff." | "Overfit". Score each

    cell as Low/Med/High. Then 1-sentence guidance: "Use when data < 10K:".

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: contains_all
      expected:
      - linear regression
      - decision tree
      - random forest
      - SVM
      - neural network
    - type: regex
      pattern: 'Use when data < 10K:'
    - type: contains_any
      expected:
      - Low
      - Med
      - High
  max_tokens: 1024
  temperature: 0.3
- id: ss-15-coffee-health
  prompt: 'Synthesize the contradictory research on coffee and health

    outcomes. Output 2 paragraphs separated by "===". Para 1: evidence

    that coffee is harmful (anxiety, heart palpitations, sleep

    disruption) with citations. Para 2: evidence coffee is beneficial

    (antioxidants, reduced dementia risk, liver protection). Then a

    1-sentence conclusion starting "Net health impact:".

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: contains_all
      expected:
      - coffee
      - antioxidants
      - dementia
    - type: regex
      pattern: ===
    - type: regex
      pattern: 'Net health impact:'
    - type: length_range
      min: 4
      max: 8
      unit: sentences
  max_tokens: 1024
  temperature: 0.5
- id: ss-16-http-2xx-count
  prompt: 'How many HTTP status codes are there in the 2xx (Success) class?

    Answer with just the number.

    '
  scoring:
    type: regex_number
    expected: 8
    tolerance: 1
  max_tokens: 64
  temperature: 0.0
- id: ss-17-bff-pattern
  prompt: 'Evaluate the Backend-for-Frontend pattern. 3 paragraphs separated

    by "---". Para 1: problem it solves (1 sentence). Para 2: concrete

    trade-off for mobile vs web (2 sentences). Para 3: when NOT to

    use it (1 sentence). Write "BFF" at least once in each paragraph.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: '---'
    - type: contains
      expected: BFF
    - type: length_range
      min: 3
      max: 6
      unit: sentences
    - type: contains_any
      expected:
      - mobile
      - web
      - client
      - frontend
  max_tokens: 512
  temperature: 0.3
- id: ss-18-mvcc-isolation
  prompt: 'Which of the following best describes MVCC''s approach to

    concurrency?

    A) Locks every row being read

    B) Creates snapshots of data at transaction start

    C) Serialises all transactions

    D) Uses a single global lock

    Answer with just the letter.

    '
  scoring:
    type: multiple_choice
    expected: B
  max_tokens: 64
  temperature: 0.0
- id: ss-19-k8s-scheduler
  prompt: 'Trace how Kubernetes schedules a pod onto a node. Numbered steps

    1-7 covering: watch, queue, filter, score, bind, kubelet watch,

    container runtime. Each step: one line, at most 12 words. Begin:

    "1. Scheduler watches for unscheduled pods."

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: ^1\. Scheduler watches for unscheduled pods\.
    - type: regex
      pattern: (?m)^[1-7]\.
    - type: contains_all
      expected:
      - filter
      - score
      - bind
      - kubelet
  max_tokens: 512
  temperature: 0.3
- id: ss-20-bitcoin-energy
  prompt: 'Debate: "Bitcoin mining is an environmental disaster." 2 paragraphs

    separated by "---". Para 1 (Pro): cite energy consumption, e-waste,

    and carbon footprint. Para 2 (Con): cite renewable adoption, grid

    balancing, and methane mitigation. Each paragraph: exactly 2

    sentences. No title or conclusion paragraph.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: '---'
    - type: contains_any
      expected:
      - energy
      - e-waste
      - renewable
      - carbon
      - grid
      - methane
    - type: length_range
      min: 4
      max: 5
      unit: sentences
  max_tokens: 768
  temperature: 0.5
