category: long_context
tasks:
  - id: lc-01-needle-8k
    prompt: |
      [FILLER: 270 repetitions of "The sun is yellow. The grass is green. The sky is blue. "]
      The secret code is ALPHA-7-XRAY.
      [FILLER: 270 repetitions of "The sun is yellow. The grass is green. The sky is blue. "]
      What is the secret code mentioned in the text?
    scoring: {type: regex, pattern: "(?i)ALPHA-7-XRAY|alpha.*7.*xray"}
    max_tokens: 256

  - id: lc-02-needle-16k
    prompt: |
      [FILLER: 540 repetitions of "The sun is yellow. The grass is green. The sky is blue. "]
      [FILLER: 270 repetitions of "The sun is yellow. The grass is green. The sky is blue. "]
      The secret code is OMEGA-9-ZULU.
      [FILLER: 270 repetitions of "The sun is yellow. The grass is green. The sky is blue. "]
      What is the secret code mentioned in the text?
    scoring: {type: regex, pattern: "(?i)OMEGA-9-ZULU|omega.*9.*zulu"}
    max_tokens: 256

  - id: lc-03-needle-32k
    prompt: |
      [FILLER: 800 repetitions of "The sun is yellow. The grass is green. The sky is blue. "]
      [FILLER: 280 repetitions of "The sun is yellow. The grass is green. The sky is blue. "]
      The secret code is DELTA-4-BRAVO.
      [FILLER: 120 repetitions of "The sun is yellow. The grass is green. The sky is blue. "]
      What is the secret code mentioned in the text?
    scoring: {type: regex, pattern: "(?i)DELTA-4-BRAVO|delta.*4.*bravo"}
    max_tokens: 256

  - id: lc-04-summarize
    prompt: |
      [FILLER: 700 repetitions of "NovaTech Industries was founded in 1987 by Dr. Ellen Chen. "]
      [FILLER: 700 repetitions of "NovaTech Industries was founded in 1987 by Dr. Ellen Chen. "]
      What year was the company founded and who was the first CEO?
    scoring:
      type: composite
      mode: all
      parts:
        - {type: contains, expected: "1987"}
        - {type: contains, expected: "Chen"}
    max_tokens: 256

  - id: lc-05-conflict-qa
    prompt: |
      Source A: The Treaty of Westbrook Summit occurred in 1998.
      [FILLER: 350 repetitions of "Source A describes trade negotiations and diplomatic breakthroughs. "]
      Source B: The Treaty of Westbrook Summit occurred in 2002.
      [FILLER: 350 repetitions of "Source B describes failed negotiations and subsequent sanctions. "]
      Which source says the event happened in 1998?
    scoring: {type: contains, expected: "Source A"}
    max_tokens: 256
