    Raises ValueError for invalid events. Reply with just Python code.

    '
  scoring:
    type: code_exec_python
    tests:
    - 'sm = StateMachine()

      sm.add_state(''idle'', {''start'': ''running''})

      sm.add_state(''running'', {''stop'': ''idle''})

      sm.set_start(''idle'')

      sm.dispatch(''start'')

      sm.dispatch(''stop'')

      try: sm.dispatch(''unknown''); assert False

      except ValueError: pass

      '
  max_tokens: 1536
  temperature: 0.3
