    scoring:
      type: code_exec_python
      tests:
        - |
          calls = []
          @retry(max_attempts=3, delay=0.01, backoff=2.0)
          def flaky():
              calls.append(1)
              if len(calls) < 2: raise ValueError("fail")
              return "ok"
          assert flaky() == "ok"
          assert len(calls) == 2
