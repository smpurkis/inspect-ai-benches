- id: sd-33-retry-backoff
  prompt: 'Write `retry(max_attempts=3, delay=1.0, backoff=2.0)` decorator. It retries
    the wrapped function on any exception, waiting delay * backoff^n seconds between
    attempts. After max_attempts, re-raises. Reply with just Python code.

    '
  scoring:
    type: code_exec_python
    tests:
    - "calls = []\n@retry(max_attempts=3, delay=0.01, backoff=2.0)\ndef flaky():\n\
      \    calls.append(1)\n    if len(calls) < 2: raise ValueError(\"fail\")\n  \
      \  return \"ok\"\nassert flaky() == \"ok\"\nassert len(calls) == 2\n"
  max_tokens: 1024
  temperature: 0.3
