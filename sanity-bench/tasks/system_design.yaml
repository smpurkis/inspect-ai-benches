  scoring:
    type: code_exec_python
    tests:
    - 'p = Pipeline()

      p.use(lambda r, n: n({**r, ''x'': r.get(''x'',0)+1}))

      p.use(lambda r, n: {**r, ''y'': r[''x''] * 2})

      assert p.run({''a'':1}) == {''a'':1, ''x'':1, ''y'':2}

      '
  max_tokens: 1024
  temperature: 0.3
