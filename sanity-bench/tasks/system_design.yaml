category: system_design
tasks:
- id: sd-21-plugin-system
  prompt: 'Design a plugin system. Write `PluginBase` (abstract base with `run(self,
    data)`) and `PluginManager` with `register(cls)`, `list()`, `execute_all(data)`.
    Plugins self-register via `__init_subclass__`. Reply with just Python code.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: class\\s+PluginBase
    - type: regex
      pattern: class\\s+PluginManager
    - type: regex
      pattern: __init_subclass__|register
    - type: regex
      pattern: execute_all
  max_tokens: 1536
  temperature: 0.3
- id: sd-22-vector-db
  prompt: 'Write a minimal vector database. `VectorDB` class with `add(id: str, vec:
    list[float])`, `search(vec: list[float], k: int) -> list[str]` returning top-k
    IDs by cosine similarity, and `delete(id: str)`. Use numpy. Reply with just Python
    code.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: class\\s+VectorDB
    - type: regex
      pattern: def\\s+add
    - type: regex
      pattern: def\\s+search
    - type: regex
      pattern: np\\.dot|cosine
  max_tokens: 1536
  temperature: 0.3
- id: sd-23-event-bus
  prompt: 'Write an event bus. `EventBus` class with `subscribe(event: str, handler:
    callable) -> int` (returns sub ID), `publish(event: str, data: any)`, and `unsubscribe(sub_id:
    int)`. Reply with just Python code.

    '
  scoring:
    type: code_exec_python
    tests:
    - 'bus = EventBus()

      events = []

      sid = bus.subscribe(''test'', lambda d: events.append(d))

      bus.publish(''test'', 42)

      bus.publish(''other'', 99)

      assert events == [42]

      bus.unsubscribe(sid)

      bus.publish(''test'', 0)

      assert events == [42]

      '
  max_tokens: 1024
  temperature: 0.3
