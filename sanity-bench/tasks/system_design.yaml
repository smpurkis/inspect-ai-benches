- id: sd-25-kv-store
  prompt: 'Write a persistent key-value store. `KVStore` class with `get(key: str)`,
    `set(key: str, value: str)`, `delete(key: str)`, and `flush()` writing to "kvstore.json".
    Loads from file on init if it exists. Reply with just Python code.

    '
  scoring:
    type: code_exec_python
    setup: 'import os, json

      '
    tests:
    - 'store = KVStore()

      store.set(''a'', ''1''); store.set(''b'', ''2'')

      store.flush()

      store2 = KVStore()

      assert store2.get(''a'') == ''1''

      assert store2.get(''b'') == ''2''

      store2.delete(''a'')

