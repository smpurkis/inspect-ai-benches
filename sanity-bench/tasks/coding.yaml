    scoring:
      type: code_exec_python
      tests:
        - |
          c = LRUCache(2)
          c.put(1,1); c.put(2,2)
          assert c.get(1) == 1
        - |
          c = LRUCache(2)
          c.put(1,1); c.put(2,2); c.put(3,3)
          assert c.get(1) == -1
        - |
          c = LRUCache(1)
          c.put(1,1); c.put(2,2)
          assert c.get(1) == -1
          assert c.get(2) == 2
        - |
          c = LRUCache(2)
          c.put(1,1); c.get(1); c.put(2,2); c.put(3,3)
          assert c.get(1) == 1
          assert c.get(2) == -1
