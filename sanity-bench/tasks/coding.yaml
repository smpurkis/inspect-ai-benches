  - id: code-06-rate-limiter
    prompt: |
      Write `RateLimiter` class. `__init__(max_requests: int, window: float)`. `allow() -> bool` returns True if <= max_requests in the last window seconds. Use time.monotonic. Reply with just Python code.
    scoring:
      type: code_exec_python
      setup: |
        import time, unittest.mock
      tests:
        - |
          with unittest.mock.patch('time.monotonic') as mt:
              mt.side_effect = [0.0, 0.1]
              r = RateLimiter(1, 1.0)
              assert r.allow() == True
              assert r.allow() == False
        - |
          with unittest.mock.patch('time.monotonic') as mt:
              mt.side_effect = [0.0, 0.1, 0.2, 1.1, 1.2]
              r = RateLimiter(2, 1.0)
              assert r.allow() == True
              assert r.allow() == True
              assert r.allow() == False
              assert r.allow() == True
              assert r.allow() == False
        - |
          with unittest.mock.patch('time.monotonic') as mt:
              mt.side_effect = [0.0]
              r = RateLimiter(0, 1.0)
              assert r.allow() == False
