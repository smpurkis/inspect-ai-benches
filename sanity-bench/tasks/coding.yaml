      type: code_exec_python
      setup: |
        import heapq
      tests:
        - |
          g = {0:[(1,4),(2,2)],1:[(3,1)],2:[(1,1),(3,5)],3:[]}
          assert shortest_path(g,0,3) == 4
        - "assert shortest_path({0:[(1,2)],1:[(0,2)]},0,1) == 2"
        - "assert shortest_path({0:[],1:[]},0,1) == -1"
        - |
          g = {0:[(1,10),(2,1)],1:[(3,1)],2:[(1,1)],3:[]}
          assert shortest_path(g,0,3) == 3
