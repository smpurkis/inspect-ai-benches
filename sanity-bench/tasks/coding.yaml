category: coding
tasks:
  - id: code-01-reverse
    prompt: |
      Write a Python function `reverse_string(s: str) -> str` that returns the
      reverse of the input string. Reply with just a Python code block.
    scoring:
      type: code_exec_python
      tests:
        - "assert reverse_string('hello') == 'olleh'"
        - "assert reverse_string('') == ''"
        - "assert reverse_string('a') == 'a'"
        - "assert reverse_string('AB CD') == 'DC BA'"
    max_tokens: 1536
  - id: code-02-fizzbuzz
    prompt: |
      Write a Python function `fizzbuzz(n: int) -> list[str]` that returns a list
      of strings for i in 1..=n where:
       - "FizzBuzz" if i is divisible by 15
       - "Fizz" if divisible by 3 (and not 15)
       - "Buzz" if divisible by 5 (and not 15)
       - str(i) otherwise.
      Reply with just a Python code block.
    scoring:
      type: code_exec_python
      tests:
        - "out = fizzbuzz(15); assert out[0]=='1' and out[2]=='Fizz' and out[4]=='Buzz' and out[14]=='FizzBuzz', out"
        - "assert fizzbuzz(0) == []"
        - "assert fizzbuzz(3) == ['1','2','Fizz']"
    max_tokens: 1536
  - id: code-03-anagram
    prompt: |
      Write a Python function `is_anagram(a: str, b: str) -> bool` that returns
      True iff `a` and `b` are anagrams of each other (case-insensitive, ignoring
      spaces). Reply with just a Python code block.
    scoring:
      type: code_exec_python
      tests:
        - "assert is_anagram('listen','silent') is True"
        - "assert is_anagram('Listen ','SILENT') is True"
        - "assert is_anagram('hello','world') is False"
        - "assert is_anagram('','') is True"
    max_tokens: 1536
  - id: code-04-prime
    prompt: |
      Write a Python function `nth_prime(n: int) -> int` that returns the n-th
      prime number where `nth_prime(1) == 2`. Assume 1 <= n <= 1000.
      Reply with just a Python code block.
    scoring:
      type: code_exec_python
      tests:
        - "assert nth_prime(1) == 2"
        - "assert nth_prime(5) == 11"
        - "assert nth_prime(10) == 29"
        - "assert nth_prime(25) == 97"
    max_tokens: 1536
  - id: code-05-flatten
    prompt: |
      Write a Python function `flatten(xs)` that takes an arbitrarily nested list
      and returns a flat list of leaf values in order.
      Reply with just a Python code block.
    scoring:
      type: code_exec_python
      tests:
        - "assert flatten([]) == []"
        - "assert flatten([1,[2,[3,[4]]]]) == [1,2,3,4]"
        - "assert flatten([[1,2],[3,4]]) == [1,2,3,4]"
        - "assert flatten([1,'a',[None,[True]]]) == [1,'a',None,True]"
    max_tokens: 1536
  - id: code-06-roman
    prompt: |
      Write a Python function `roman_to_int(s: str) -> int` that converts a Roman
      numeral (1..3999) to an integer. Reply with just a Python code block.
    scoring:
      type: code_exec_python
      tests:
        - "assert roman_to_int('III') == 3"
        - "assert roman_to_int('IV') == 4"
        - "assert roman_to_int('LVIII') == 58"
        - "assert roman_to_int('MCMXCIV') == 1994"
    max_tokens: 1536
  - id: code-07-balanced
    prompt: |
      Write a Python function `is_balanced(s: str) -> bool` that returns True iff
      brackets `()`, `[]`, `{}` in `s` are correctly matched/nested. Other characters
      should be ignored. Reply with just a Python code block.
    scoring:
      type: code_exec_python
      tests:
        - "assert is_balanced('()') is True"
        - "assert is_balanced('([{}])') is True"
        - "assert is_balanced('([)]') is False"
        - "assert is_balanced('(a + b) * [c]') is True"
        - "assert is_balanced(')(') is False"
    max_tokens: 1536
  - id: code-08-running
    prompt: |
      Write a Python function `running_average(nums: list[float]) -> list[float]`
      that returns a list of the same length where element i is the average of
      `nums[:i+1]`. Reply with just a Python code block.
    scoring:
      type: code_exec_python
      tests:
        - "assert running_average([]) == []"
        - "out = running_average([1.0, 2.0, 3.0, 4.0]); assert out == [1.0, 1.5, 2.0, 2.5], out"
        - "out = running_average([10.0]); assert out == [10.0], out"
    max_tokens: 1536
  - id: code-09-merge
    prompt: |
      Write a Python function `merge_sorted(a: list[int], b: list[int]) -> list[int]`
      that takes two sorted ascending lists and returns their merged sorted list
      without using `sorted()`. Reply with just a Python code block.
    scoring:
      type: code_exec_python
      tests:
        - "assert merge_sorted([], []) == []"
        - "assert merge_sorted([1,3,5], [2,4,6]) == [1,2,3,4,5,6]"
        - "assert merge_sorted([1,1,2], [1,3]) == [1,1,1,2,3]"
        - "assert merge_sorted([1,2,3], []) == [1,2,3]"
    max_tokens: 1536
  - id: code-10-words
    prompt: |
      Write a Python function `top_words(text: str, k: int) -> list[str]` that
      returns the k most frequent lowercased word tokens (split on whitespace,
      stripped of punctuation) in `text`. Break ties by alphabetical order.
      Reply with just a Python code block.
    scoring:
      type: code_exec_python
      tests:
        - "assert top_words('a b a c b a', 2) == ['a','b']"
        - "assert top_words('Hello, hello world!', 2) == ['hello','world']"
        - "assert top_words('', 5) == []"
        - "out = top_words('x y z', 2); assert out == ['x','y'], out"
    max_tokens: 1536
  - id: code-11-rle
    prompt: |
      Write a Python function `run_length_encode(s: str) -> list[tuple[str,int]]`
      that returns a list of (character, count) pairs in order of first
      appearance, where each pair counts a run of the same character.
      Reply with just a Python code block.
    scoring:
      type: code_exec_python
      tests:
        - "assert run_length_encode('') == []"
        - "assert run_length_encode('aaabb') == [('a',3),('b',2)]"
        - "assert run_length_encode('abc') == [('a',1),('b',1),('c',1)]"
        - "assert run_length_encode('aabbaa') == [('a',2),('b',2),('a',2)]"
    max_tokens: 768

  - id: code-12-deepget
    prompt: |
      Write `deep_get(obj, path: str, default=None)` that takes a nested
      dict/list structure and a dotted/bracketed path (e.g. `"a.b[0].c"`) and
      returns the value at that path, or `default` if any step fails.
      Reply with just a Python code block.
    scoring:
      type: code_exec_python
      tests:
        - "d={'a':{'b':[{'c':42}]}}; assert deep_get(d,'a.b[0].c') == 42"
        - "assert deep_get({}, 'x.y', default=0) == 0"
        - "assert deep_get({'a':[1,2,3]}, 'a[2]') == 3"
        - "assert deep_get({'a':{'b':1}}, 'a.c', default='miss') == 'miss'"
    max_tokens: 1024

  - id: code-13-graph
    prompt: |
      Write `shortest_path(graph: dict, start, end)` returning the
      shortest-edge-count path from `start` to `end` as a list of nodes (or
      `[]` if no path). `graph` maps node -> list of neighbour nodes. Use BFS.
      Reply with just a Python code block.
    scoring:
      type: code_exec_python
      tests:
        - "g={'A':['B','C'],'B':['D'],'C':['D'],'D':[]}; assert shortest_path(g,'A','D') in (['A','B','D'],['A','C','D'])"
        - "g={'A':['B'],'B':[],'C':[]}; assert shortest_path(g,'A','C') == []"
        - "g={'A':['A']}; assert shortest_path(g,'A','A') == ['A']"
    max_tokens: 1024

  - id: code-14-perm
    prompt: |
      Write `next_permutation(nums: list[int]) -> list[int]` that returns the
      next lexicographic permutation of `nums`. If `nums` is the largest
      permutation, return its lowest (sorted ascending). Mutate or return — a
      returned list is fine. Reply with just a Python code block.
    scoring:
      type: code_exec_python
      tests:
        - "assert next_permutation([1,2,3]) == [1,3,2]"
        - "assert next_permutation([3,2,1]) == [1,2,3]"
        - "assert next_permutation([1,1,5]) == [1,5,1]"
        - "assert next_permutation([]) == []"
    max_tokens: 1024

  - id: code-15-cache
    prompt: |
      Write a class `LRUCache` with `__init__(self, capacity: int)`,
      `get(self, key) -> Any | None`, and `put(self, key, value)`. Evict the
      least-recently-used entry when capacity is exceeded. Reply with just a
      Python code block.
    scoring:
      type: code_exec_python
      tests:
        - |
          c = LRUCache(2)
          c.put('a',1); c.put('b',2)
          assert c.get('a') == 1
          c.put('c',3)  # evicts b
          assert c.get('b') is None and c.get('a') == 1 and c.get('c') == 3
        - |
          c = LRUCache(1)
          c.put('x',1); c.put('y',2)
          assert c.get('x') is None and c.get('y') == 2
    max_tokens: 1024

  - id: code-16-dates
    prompt: |
      Write `days_between(d1: str, d2: str) -> int` returning the absolute
      number of days between two dates in 'YYYY-MM-DD' format. You may use the
      stdlib `datetime`. Reply with just a Python code block.
    scoring:
      type: code_exec_python
      tests:
        - "assert days_between('2020-01-01','2020-01-02') == 1"
        - "assert days_between('2020-02-28','2020-03-01') == 2"
        - "assert days_between('2024-12-31','2024-01-01') == 365"
    max_tokens: 768

  - id: code-17-trie
    prompt: |
      Implement a `Trie` class with `insert(word)` and `search_prefix(prefix)`
      that returns the number of inserted words starting with that prefix.
      Reply with just a Python code block.
    scoring:
      type: code_exec_python
      tests:
        - |
          t = Trie()
          for w in ['apple','app','apt','banana']: t.insert(w)
          assert t.search_prefix('ap') == 3
          assert t.search_prefix('app') == 2
          assert t.search_prefix('ban') == 1
          assert t.search_prefix('zzz') == 0
    max_tokens: 1024

  - id: code-18-knapsack
    prompt: |
      Write `knapsack(weights: list[int], values: list[int], capacity: int) -> int`
      that returns the maximum value achievable with the 0/1 knapsack problem.
      Reply with just a Python code block.
    scoring:
      type: code_exec_python
      tests:
        - "assert knapsack([1,3,4,5],[1,4,5,7],7) == 9"
        - "assert knapsack([],[],10) == 0"
        - "assert knapsack([10],[5],5) == 0"
    max_tokens: 1024

  - id: code-19-regex
    prompt: |
      Write `match_glob(pattern: str, name: str) -> bool` supporting `*` (any
      run of chars including none) and `?` (exactly one char). Reply with just
      a Python code block. Do not use the `fnmatch` module.
    scoring:
      type: code_exec_python
      tests:
        - "assert match_glob('a*c','abc') is True"
        - "assert match_glob('a*c','ac') is True"
        - "assert match_glob('a?c','abc') is True"
        - "assert match_glob('a?c','ac') is False"
        - "assert match_glob('*','anything') is True"
        - "assert match_glob('','') is True"
    max_tokens: 1024

  - id: code-20-rotate
    prompt: |
      Write `rotate_image(matrix: list[list[int]]) -> list[list[int]]` that
      rotates an n×n matrix 90° clockwise. Return a new matrix (don't mutate
      the input). Reply with just a Python code block.
    scoring:
      type: code_exec_python
      tests:
        - "assert rotate_image([[1,2],[3,4]]) == [[3,1],[4,2]]"
        - "assert rotate_image([[1]]) == [[1]]"
        - "m=[[1,2,3],[4,5,6],[7,8,9]]; out=rotate_image(m); assert out==[[7,4,1],[8,5,2],[9,6,3]] and m==[[1,2,3],[4,5,6],[7,8,9]]"
    max_tokens: 1024
