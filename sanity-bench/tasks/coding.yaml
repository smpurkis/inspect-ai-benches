      type: code_exec_python
      tests:
        - "assert lis_length([3,1,2,4]) == 3"
        - "assert lis_length([5,4,3,2,1]) == 1"
        - "assert lis_length([]) == 0"
        - "assert lis_length([1,2,3,0,4,5]) == 5"
        - "assert lis_length([10,9,2,5,3,7,101,18]) == 4"
