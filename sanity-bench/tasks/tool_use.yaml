category: tool_use
tasks:


  - id: tu-11-secrets-mgmt
    prompt: |
      Tools:
        store_secret(name: str, value: str, rotation: str) -> str
        get_secret(arn: str) -> str
        create_policy(name: str, actions: list[str], resource: str) -> str
        attach_to_role(policy_arn: str, role: str) -> None
        rotate_now(secret_arn: str) -> None

      User: "Store secret 'DB_PASSWORD' with value 's3cre+!' and rotation '30d'. Retrieve it to verify. Create policy allowing 'secretsmanager:GetSecretValue' on it. Attach to role 'app-server'. Trigger immediate rotation."

      Output JSON tool calls in order.
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: '"store_secret"'}
        - {type: regex, pattern: '"get_secret"'}
        - {type: regex, pattern: '"create_policy"'}
        - {type: regex, pattern: '"attach_to_role"'}
        - {type: regex, pattern: '"rotate_now"'}
    max_tokens: 512
    temperature: 0.3

