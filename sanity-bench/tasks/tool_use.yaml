        create_scaling_policy(asg: str, metric: str, target: float) -> str
        simulate_load(asg: str, duration_sec: int) -> dict

      User: "Create launch template 'web-template' with ami-1234, t3.medium. Create ASG 'web-asg' min=2 max=10 desired=2. Attach target group 'web-tg'. Create CPU-based scaling policy targeting 60%. Simulate 5 min load."

      Output JSON tool calls in order.
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: '"create_launch_template"'}
        - {type: regex, pattern: '"create_asg"'}
        - {type: regex, pattern: '"attach_lb"'}
        - {type: regex, pattern: '"create_scaling_policy"'}
        - {type: regex, pattern: '"simulate_load"'}
    max_tokens: 512
    temperature: 0.3

