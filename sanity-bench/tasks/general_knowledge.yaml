  max_tokens: 384
- id: gk-10-psat-np
  prompt: 'Which of these would immediately follow if a deterministic polynomial-time
    algorithm for SAT were discovered?

    (A) P != NP

    (B) P = NP and co-NP = NP

    (C) NP-complete problems remain intractable

    (D) Only co-NP problems become tractable

    Answer with just the letter.

    '
  scoring:
    type: multiple_choice
    expected: B
  max_tokens: 384
- id: gk-11-krebs-cycle
  prompt: 'In the citric acid cycle, citrate is isomerized to isocitrate via the enzyme
    aconitase, which contains an iron-sulfur cluster. Isocitrate then undergoes oxidative
