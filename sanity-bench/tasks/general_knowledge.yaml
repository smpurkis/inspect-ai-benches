category: general_knowledge
tasks:
- id: gk-01-mitochondrial-import
  prompt: 'A nuclear-encoded protein destined for the mitochondrial matrix must traverse
    both the outer and inner membranes. Which pair of translocase complexes facilitates
    this import, and what provides the energetic driving force for the final step?

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: contains_all
      expected:
      - TOM
      - TIM23
    - type: contains_any
      expected:
      - ATP hydrolysis
      - ATP
      - Hsp70
  max_tokens: 384
- id: gk-02-chandrasekhar-limit
  prompt: 'A white dwarf with a mass of 1.5 solar masses would collapse under its
    own gravity because it exceeds the Chandrasekhar limit. What fundamental quantum
    mechanical principle prevents collapse below this threshold, and what degenerate
    particle species provides the supporting pressure?

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: contains
      expected: Pauli
    - type: contains_any
      expected:
      - electron
      - electrons
  max_tokens: 384
- id: gk-03-mens-rea-lect
  prompt: 'In common law, the mens rea for murder is "malice aforethought." This does
    not require ill will but encompasses four mental states. Two are "intent to kill"
    and "intent to cause grievous bodily harm." Name the other two.

    '
  scoring:
    type: composite
    mode: all
