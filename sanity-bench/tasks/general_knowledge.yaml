    - type: contains
      expected: depraved
    - type: contains_any
      expected:
      - heart
      - reckless indifference
  max_tokens: 384
- id: gk-04-lagrange-points
  prompt: 'In the circular restricted three-body problem, five Lagrange points exist
    where gravitational and centrifugal forces balance. Two are stable, three are
