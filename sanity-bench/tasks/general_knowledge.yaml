      - horn
      - hundred
      - head
      - hear
  max_tokens: 384
- id: gk-08-marbury-doctrine
  prompt: 'In Marbury v. Madison (1803), Chief Justice Marshall established the principle
    of judicial review. However, the Court held that it lacked jurisdiction to issue
    the writ of mandamus sought by Marbury. Which section of which act did the Court
    strike down as unconstitutional?

    '
  scoring:
    type: contains
    expected: Section 13 of the Judiciary Act
  max_tokens: 384
- id: gk-09-open-reading-frame
  prompt: 'In molecular biology, an open reading frame begins with a start codon and
    ends with a stop codon in the same reading frame. In the standard genetic code,
