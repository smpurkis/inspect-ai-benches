      - stable
      - cold
      - unobstructed
      - continuous view
  max_tokens: 384
- id: gk-05-synth-organic
  prompt: 'In the Diels-Alder cycloaddition, an electron-rich diene reacts with an
    electron-deficient dienophile. If the diene bears an electron-donating group and
    the dienophile bears an electron-withdrawing group, which orbital interaction
    (HOMO/LUMO of which reactant) primarily governs the reaction rate?

    '
  scoring:
    type: contains_any
    expected:
    - HOMO of diene
    - HOMO diene
    flags:
    - I
  max_tokens: 256
- id: gk-06-coase-theorem
  prompt: 'The Coase theorem states that when property rights are clearly defined
    and transaction costs are zero, bargaining will lead to an efficient outcome regardless
    of the initial allocation. Name the economist who formulated this theorem and
    the key real-world friction that makes it often inapplicable.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: contains
      expected: Coase
    - type: contains_any
      expected:
      - transaction cost
      - transaction costs
  max_tokens: 384
- id: gk-07-grimms-law
  prompt: 'Grimm''s law describes the First Germanic Sound Shift, transforming Proto-Indo-European
