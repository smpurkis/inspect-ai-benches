    it generates directly.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: contains_all
      expected:
      - isocitrate dehydrogenase
      - NADH
      - alpha-ketoglutarate
  max_tokens: 384
- id: gk-12-library-of-alexandria
  prompt: 'The Great Library of Alexandria was part of the Musaeum, a research institution
    funded by the Ptolemaic dynasty. It is said to have burned down multiple times.
    One major fire occurred during Julius Caesar''s siege of Alexandria in 48 BCE.
    Which Alexandrian ruler was on the throne at that time?

    '
  scoring:
