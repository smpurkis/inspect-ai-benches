    expected: Ptolemy
  max_tokens: 256
- id: gk-13-thermohaline-circulation
  prompt: 'The Atlantic Meridional Overturning Circulation (AMOC) is driven by density
    gradients caused by temperature and salinity differences. When warm, saline water
    from the tropics moves northward, it cools and sinks in the North Atlantic. What
    two processes increase the salinity in this region before sinking occurs?

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: contains
      expected: sea ice formation
    - type: contains
      expected: evaporation
  max_tokens: 384
- id: gk-14-encryption-rsa
  prompt: 'RSA encryption relies on the practical difficulty of factoring the product
    of two large primes. The public key consists of (n, e) where n = p × q. The private
    key d satisfies e × d ≡ 1 (mod φ(n)). If an attacker could compute φ(n) efficiently,
    what function could they then compute to break the system?

    '
  scoring:
    type: contains_any
    expected:
    - modular inverse of e
    - private key
    - d
  max_tokens: 256
- id: gk-15-leidenfrost-point
  prompt: 'A water droplet on a surface heated well above boiling point skitters across
    the surface without wetting it. This is the Leidenfrost effect. Above a certain
    temperature called the Leidenfrost point, a vapor layer insulates the droplet.
    For water on a stainless steel surface at atmospheric pressure, what is the approximate
    temperature range of the Leidenfrost point (in Celsius)?

    '
  scoring:
    type: regex
    pattern: (19[0-9]|2[0-4][0-9]|250)\s*°?\s*C
  max_tokens: 256
- id: gk-16-laryngeal-theory
  prompt: 'The laryngeal theory in Indo-European linguistics posits that PIE had phonemes
    /h1/, /h2/, /h3/ that were lost in most daughter languages but colored adjacent
    vowels. /h2/ colored a following /e/ to /a/. In which Anatolian language, a daughter
    of PIE, were laryngeals directly preserved in cuneiform writing?

    '
  scoring:
    type: contains
    expected: Hittite
  max_tokens: 256
