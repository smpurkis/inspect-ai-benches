  - id: debug-51-deadlock
    prompt: |
      `transfer` should move amount from account a to b without deadlock. The buggy version acquires locks in different order depending on arguments, causing potential deadlock. Fix it by ordering locks consistently. Reply with corrected Python code block.

      ```python
      import threading
      def transfer(a_lock, b_lock, a_bal, b_bal, amount):
          with a_lock:
              with b_lock:
                  a_bal[0] -= amount
                  b_bal[0] += amount
      ```
    scoring:
      type: code_exec_python
      setup: |
        import threading
      tests:
        - |
          la, lb = threading.Lock(), threading.Lock()
          ba, bb = [100], [100]
          transfer(la, lb, ba, bb, 50)
          assert ba[0] == 50 and bb[0] == 150
        - |
          la, lb = threading.Lock(), threading.Lock()
          ba, bb = [100], [100]
          # Reverse order should also work (avoiding deadlock)
          transfer(lb, la, bb, ba, 30)
          assert ba[0] == 130 and bb[0] == 70
    max_tokens: 1024

  - id: debug-52-binary-search-ub
    prompt: |
      `first_occurrence` should return the index of the first occurrence of target in sorted xs, or -1 if not found. The buggy version may return a later occurrence instead of the first. Fix it. Reply with corrected Python code block.

      ```python
      def first_occurrence(xs: list[int], target: int) -> int:
          lo, hi = 0, len(xs) - 1
          while lo <= hi:
              mid = (lo + hi) // 2
              if xs[mid] >= target:
                  hi = mid - 1
              else:
                  lo = mid + 1
          return lo if lo < len(xs) and xs[lo] == target else -1
      ```
