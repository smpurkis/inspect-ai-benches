  - id: debug-07-fibonacci
    prompt: |
      `fib` should return the n-th Fibonacci number with `fib(0)==0, fib(1)==1`.
      The buggy version is off by one on the base cases. Fix it.
      Reply with just the corrected Python code block.

      ```python
      def fib(n: int) -> int:
          if n <= 1:
              return n + 1
          return fib(n - 1) + fib(n - 2)
      ```
    scoring:
      type: code_exec_python
      tests:
        - "assert fib(0) == 0"
        - "assert fib(1) == 1"
        - "assert fib(2) == 1"
        - "assert fib(10) == 55"
    max_tokens: 1536
  - id: debug-08-dict-count
