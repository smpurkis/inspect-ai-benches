  - id: debug-09-binary-search
    prompt: |
      `binsearch` should return the index of `target` in a sorted list `xs`, or -1
      if absent. Bug: an infinite loop when target is greater than all elements.
      Fix it. Reply with just the corrected Python code block.

      ```python
      def binsearch(xs, target):
          lo, hi = 0, len(xs) - 1
          while lo <= hi:
              mid = (lo + hi) // 2
              if xs[mid] == target:
                  return mid
              elif xs[mid] < target:
                  lo = mid
              else:
                  hi = mid
          return -1
      ```
    scoring:
      type: code_exec_python
      tests:
        - "assert binsearch([], 1) == -1"
        - "assert binsearch([1,2,3,4,5], 4) == 3"
        - "assert binsearch([1,2,3,4,5], 6) == -1"
        - "assert binsearch([1,2,3,4,5], 1) == 0"
        - "assert binsearch([1,2,3,4,5], 5) == 4"
    max_tokens: 1536
