category: coding_debug
tasks:
- id: debug-21-mutable-default
  prompt: "`add_task` should add a task to a list and return it. The buggy version\
    \ shares state across calls. Fix it. Reply with corrected Python code block.\n\
    \n```python\ndef add_task(task: str, tasks: list = []) -> list:\n    tasks.append(task)\n\
    \    return tasks\n```\n"
  scoring:
    type: code_exec_python
    tests:
    - assert add_task('a') == ['a']
    - assert add_task('b') == ['b']
    - assert add_task('c', []) == ['c']
    - assert add_task('x', ['y']) == ['y', 'x']
  max_tokens: 768
- id: debug-22-remove-while-iter
  prompt: "`remove_negatives` should return a list with all negative numbers removed.\
    \ The buggy version skips elements. Fix it. Reply with corrected Python code block.\n\
    \n```python\ndef remove_negatives(xs: list[int]) -> list[int]:\n    for x in xs:\n\
    \        if x < 0:\n            xs.remove(x)\n    return xs\n```\n"
  scoring:
    type: code_exec_python
    tests:
    - assert remove_negatives([1,-1,2,-2,3]) == [1,2,3]
    - assert remove_negatives([-1,-2,-3]) == []
    - assert remove_negatives([]) == []
    - assert remove_negatives([1,2,3]) == [1,2,3]
  max_tokens: 768
- id: debug-23-binary-search-ob1
  prompt: "`binary_search` should return the index of target in sorted xs, or -1 if\
    \ not found. The buggy version misses the last element. Fix it. Reply with corrected\
    \ Python code block.\n\n```python\ndef binary_search(xs: list[int], target: int)\
    \ -> int:\n    lo, hi = 0, len(xs) - 1\n    while lo < hi:\n        mid = (lo\
    \ + hi) // 2\n        if xs[mid] == target:\n            return mid\n        if\
    \ xs[mid] < target:\n            lo = mid + 1\n        else:\n            hi =\
    \ mid - 1\n    return -1\n```\n"
  scoring:
    type: code_exec_python
    tests:
    - assert binary_search([1,2,3,4,5], 5) == 4
    - assert binary_search([1,2,3,4,5], 1) == 0
    - assert binary_search([1,2,3,4,5], 6) == -1
    - assert binary_search([], 1) == -1
    - assert binary_search([5], 5) == 0
  max_tokens: 1024
- id: debug-24-float-compare
  prompt: "`approx_equal` should return True if a and b are within 0.001 of each other.\
    \ The buggy version fails for near-equal floats. Fix it. Reply with corrected\
    \ Python code block.\n\n```python\ndef approx_equal(a: float, b: float) -> bool:\n\
    \    return a == b\n```\n"
  scoring:
    type: code_exec_python
    tests:
    - assert approx_equal(0.1 + 0.2, 0.3) is True
    - assert approx_equal(1.0, 1.0) is True
    - assert approx_equal(1.0, 1.002) is False
    - assert approx_equal(1.0, 1.0005) is True
  max_tokens: 768
- id: debug-25-closure-loop
  prompt: "`make_multipliers` should return a list where [0](x)=0*x, [1](x)=1*x, ...,\
    \ [4](x)=4*x. The buggy version all return the same value. Fix it. Reply with\
    \ corrected Python code block.\n\n```python\ndef make_multipliers() -> list:\n\
    \    return [lambda x: x * i for i in range(5)]\n```\n"
  scoring:
    type: code_exec_python
    tests:
    - ms = make_multipliers(); assert ms[0](2) == 0
    - ms = make_multipliers(); assert ms[1](3) == 3
    - ms = make_multipliers(); assert ms[2](5) == 10
    - ms = make_multipliers(); assert ms[3](2) == 6
    - ms = make_multipliers(); assert ms[4](2) == 8
  max_tokens: 768
- id: debug-26-list-mult-ref
  prompt: "`make_grid` should create an rows × cols grid filled with val. The buggy\
    \ version shares rows. Fix it. Reply with corrected Python code block.\n\n```python\n\
    def make_grid(rows: int, cols: int, val: int = 0) -> list[list[int]]:\n    return\
    \ [[val] * cols] * rows\n```\n"
  scoring:
    type: code_exec_python
    tests:
    - 'g = make_grid(2, 3, 0)

      g[0][0] = 1

      assert g[1][0] == 0

      '
    - assert make_grid(0, 5) == []
    - assert make_grid(2, 2, 1) == [[1,1],[1,1]]
    - 'g = make_grid(3, 1, 0)

      g[0][0] = 5

      assert g[1][0] == 0

      assert g[2][0] == 0

      '
  max_tokens: 768
- id: debug-27-premature-return
  prompt: "`all_positive` should return True if all numbers are > 0. The buggy version\
    \ returns True after the first positive. Fix it. Reply with corrected Python code\
    \ block.\n\n```python\ndef all_positive(xs: list[int]) -> bool:\n    for x in\
    \ xs:\n        if x <= 0:\n            return False\n        else:\n         \
    \   return True\n    return True\n```\n"
  scoring:
    type: code_exec_python
    tests:
    - assert all_positive([1,2,3]) is True
    - assert all_positive([1,0,3]) is False
    - assert all_positive([-1,2]) is False
    - assert all_positive([]) is True
  max_tokens: 768
- id: debug-28-string-immutable
  prompt: "`swap_ends` should return a new string with first and last characters swapped.\
    \ The buggy version tries to mutate in place. Fix it. Reply with corrected Python\
    \ code block.\n\n```python\ndef swap_ends(s: str) -> str:\n    if len(s) < 2:\n\
    \        return s\n    s[0], s[-1] = s[-1], s[0]\n    return s\n```\n"
  scoring:
    type: code_exec_python
    tests:
    - assert swap_ends('hello') == 'oellh'
    - assert swap_ends('ab') == 'ba'
    - assert swap_ends('a') == 'a'
    - assert swap_ends('') == ''
  max_tokens: 768
- id: debug-29-rounding-trunc
  prompt: "`to_percent` should return the percentage as a whole integer, rounding\
    \ properly. The buggy version always truncates. Fix it. Reply with corrected Python\
    \ code block.\n\n```python\ndef to_percent(score: float, total: float) -> int:\n\
    \    return int(score / total * 100)\n```\n"
  scoring:
    type: code_exec_python
    tests:
    - assert to_percent(2, 3) == 67
    - assert to_percent(1, 4) == 25
    - assert to_percent(75, 100) == 75
    - assert to_percent(1, 6) == 17
  max_tokens: 768
- id: debug-30-is-vs-eq
  prompt: "`last_equals_first` should return True if the first and last elements have\
    \ the same value. The buggy version fails for equal values beyond the small integer\
    \ cache. Fix it. Reply with corrected Python code block.\n\n```python\ndef last_equals_first(xs:\
    \ list) -> bool:\n    if not xs:\n        return True\n    return xs[0] is xs[-1]\n\
    ```\n"
  scoring:
    type: code_exec_python
    tests:
    - assert last_equals_first([1000, 999, 1000]) is True
    - assert last_equals_first([1, 2, 3]) is False
    - assert last_equals_first([]) is True
    - assert last_equals_first(['a', 'b', 'a']) is True
  max_tokens: 768
- id: debug-31-bool-logic
  prompt: "`is_valid_user` should return True if name is non-empty AND age ≥ 18. The\
    \ buggy version accepts empty names. Fix it. Reply with corrected Python code\
    \ block.\n\n```python\ndef is_valid_user(name: str, age: int) -> bool:\n    return\
    \ name != \"\" or age >= 18\n```\n"
  scoring:
    type: code_exec_python
    tests:
    - assert is_valid_user('Alice', 25) is True
    - assert is_valid_user('', 30) is False
    - assert is_valid_user('Bob', 16) is False
    - assert is_valid_user('', 15) is False
  max_tokens: 768
- id: debug-32-wrong-comparator
  prompt: "`top_k` should return the k largest elements in descending order. The buggy\
    \ version returns them in ascending order. Fix it. Do NOT use reverse=True. Reply\
    \ with corrected Python code block.\n\n```python\ndef top_k(xs: list[int], k:\
    \ int) -> list[int]:\n    return sorted(xs, key=lambda x: -x)[:k]\n```\n"
  scoring:
    type: code_exec_python
    tests:
    - assert top_k([3,1,4,1,5,9,2], 3) == [9,5,4]
    - assert top_k([1,2,3], 2) == [3,2]
    - assert top_k([], 0) == []
    - assert top_k([5], 1) == [5]
  max_tokens: 768
- id: debug-33-shallow-copy
  prompt: "`copy_grid` should return a deep copy of a 2D list. The buggy version only\
    \ copies the outer list, so mutations to nested lists affect the original. Fix\
    \ it. Reply with corrected Python code block.\n\n```python\ndef copy_grid(grid:\
    \ list[list[int]]) -> list[list[int]]:\n    return list(grid)\n```\n"
  scoring:
    type: code_exec_python
    tests:
    - 'orig = [[1,2],[3,4]]

      cp = copy_grid(orig)

      cp[0][0] = 99

      assert orig[0][0] == 1

      '
    - assert copy_grid([]) == []
    - assert copy_grid([[1]]) == [[1]]
    - 'orig = [[1,2,3],[4,5,6]]

      cp = copy_grid(orig)

      cp[1][1] = 99

      assert orig[1][1] == 5

      '
  max_tokens: 768
- id: debug-34-int-div
  prompt: "`avg_score` should return the mean of a list of integers as a float. The\
    \ buggy version performs integer division. Fix it. Reply with corrected Python\
    \ code block.\n\n```python\ndef avg_score(scores: list[int]) -> float:\n    return\
    \ sum(scores) // len(scores)\n```\n"
  scoring:
    type: code_exec_python
    tests:
    - assert avg_score([1, 2, 3, 4]) == 2.5
    - assert avg_score([5, 10]) == 7.5
    - assert avg_score([0, 0, 1]) == 1/3
    - assert avg_score([1]) == 1.0
  max_tokens: 768
- id: debug-35-wrong-except
  prompt: "`safe_divide` should return a/b for ints or floats. If b is 0, return \"\
    inf\". The buggy version crashes on string inputs. Fix it. Reply with corrected\
    \ Python code block.\n\n```python\ndef safe_divide(a, b):\n    try:\n        return\
    \ a / b\n    except ZeroDivisionError:\n        return \"inf\"\n```\n"
  scoring:
    type: code_exec_python
    tests:
    - assert safe_divide(10, 2) == 5.0
    - assert safe_divide(10, 0) == 'inf'
    - assert safe_divide('10', 2) == 5.0
    - assert safe_divide(10, '2') == 5.0
  max_tokens: 768
- id: debug-36-rec-mut-default
  prompt: "`tree_depth` should return the depth of a nested list (e.g. [1,[2,[3]]]\
    \ → 3). The buggy version accumulates depth across independent calls. Fix it.\
    \ Reply with corrected Python code block.\n\n```python\ndef tree_depth(nested:\
    \ list, depth: int = 0) -> int:\n    if not nested:\n        return depth\n  \
    \  return max(tree_depth(x, depth + 1) for x in nested if isinstance(x, list))\n\
    ```\n"
  scoring:
    type: code_exec_python
    tests:
    - assert tree_depth([1,[2,[3]]]) == 3
    - assert tree_depth([1,2,3]) == 0
    - assert tree_depth([]) == 0
    - assert tree_depth([1,[2,[3,[4]]]]) == 4
  max_tokens: 768
- id: debug-37-generator-exhaust
  prompt: "`first_two` should return the first two items from a generator. The buggy\
    \ version exhausts the generator before reading. Fix it. Reply with corrected\
    \ Python code block.\n\n```python\ndef first_two(gen):\n    items = list(gen)\n\
    \    return [next(gen), next(gen)]\n```\n"
  scoring:
    type: code_exec_python
    tests:
    - assert first_two(iter([1,2,3,4])) == [1,2]
    - assert first_two(iter([10])) == [10]
    - assert first_two(iter([])) == []
    - assert first_two(iter([1,2,3,4,5])) == [1,2]
  max_tokens: 768
- id: debug-38-for-else-bug
  prompt: "`has_even` should return True if any number is even. The buggy version\
    \ returns False if the last number checked is odd, even if an earlier number was\
    \ even. Fix it. Reply with corrected Python code block.\n\n```python\ndef has_even(xs:\
    \ list[int]) -> bool:\n    for x in xs:\n        if x % 2 == 0:\n            return\
    \ True\n        else:\n            return False\n    return False\n```\n"
  scoring:
    type: code_exec_python
    tests:
    - assert has_even([1,2,3]) is True
    - assert has_even([1,3,5]) is False
    - assert has_even([]) is False
    - assert has_even([4]) is True
  max_tokens: 768
- id: debug-39-typo-shadow
  prompt: "`count_positives` should return how many numbers are > 0. The buggy version\
    \ assigns to the wrong variable. Fix it. Reply with corrected Python code block.\n\
    \n```python\ndef count_positives(xs: list[int]) -> int:\n    count = 0\n    for\
    \ x in xs:\n        if x > 0:\n            count = x\n    return count\n```\n"
  scoring:
    type: code_exec_python
    tests:
    - assert count_positives([1, -2, 3, -4, 5]) == 3
    - assert count_positives([-1, -2]) == 0
    - assert count_positives([]) == 0
    - assert count_positives([0, 0, 1]) == 1
  max_tokens: 768
- id: debug-40-remove-forward
  prompt: "`dedup_adjacent` should remove consecutive duplicates in-place, returning\
    \ the list. The buggy version skips elements after a removal. Fix it. Reply with\
    \ corrected Python code block.\n\n```python\ndef dedup_adjacent(xs: list[int])\
    \ -> list[int]:\n    i = 0\n    while i < len(xs) - 1:\n        if xs[i] == xs[i+1]:\n\
    \            xs.pop(i)\n        i += 1\n    return xs\n```\n"
  scoring:
    type: code_exec_python
    tests:
    - assert dedup_adjacent([1,1,2,2,3]) == [1,2,3]
    - assert dedup_adjacent([1,1,1,1]) == [1]
    - assert dedup_adjacent([]) == []
    - assert dedup_adjacent([1,2,3]) == [1,2,3]
  max_tokens: 768
