category: coding_debug
tasks:
  - id: debug-21-mutable-default
    prompt: |
      `add_task` should add a task to a list and return it. The buggy version shares state across calls. Fix it. Reply with corrected Python code block.

      ```python
      def add_task(task: str, tasks: list = []) -> list:
          tasks.append(task)
          return tasks
      ```
    scoring:
      type: code_exec_python
      tests:
        - "assert add_task('a') == ['a']"
        - "assert add_task('b') == ['b']"
        - "assert add_task('c', []) == ['c']"
        - "assert add_task('x', ['y']) == ['y', 'x']"
    max_tokens: 768

  - id: debug-22-remove-while-iter
    prompt: |
