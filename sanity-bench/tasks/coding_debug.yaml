  - id: debug-50-stale-cache
    prompt: |
      `TimestampCache` should return the cached value only within ttl_seconds. The buggy version does not check staleness correctly and returns stale data. Fix it. Reply with corrected Python code block.

      ```python
      import time
      class TimestampCache:
          def __init__(self):
              self._data = {}
          def set(self, k: str, v: any):
              self._data[k] = (v, time.monotonic())
          def get(self, k: str, ttl: float = 10.0):
              if k in self._data:
                  return self._data[k][0]
              return None
      ```
    scoring:
      type: code_exec_python
      setup: |
        import time, unittest.mock
      tests:
