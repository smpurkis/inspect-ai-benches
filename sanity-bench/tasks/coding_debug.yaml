  - id: debug-44-memory-leak
    prompt: |
      `Cache` class should store key-value pairs. The buggy version holds references to all past values even after deletion (memory leak). Fix it. Reply with corrected Python code block.

      ```python
      class Cache:
          def __init__(self):
              self._store = {}
              self._all_values = []
          def set(self, k: str, v: object):
              self._store[k] = v
              self._all_values.append(v)
          def get(self, k: str):
              return self._store.get(k)
          def delete(self, k: str):
              self._store.pop(k, None)
      ```
    scoring:
      type: code_exec_python
      tests:
        - |
          c = Cache()
          c.set('a', [1,2,3]); c.set('b', [4,5,6])
          c.delete('a')
          assert c.get('a') is None
          assert c.get('b') == [4,5,6]
        - "assert Cache().get('missing') is None"
    max_tokens: 1024

