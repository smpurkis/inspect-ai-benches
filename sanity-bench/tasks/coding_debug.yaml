category: coding_debug
tasks:
  - id: debug-01-offbyone
    prompt: |
      The function below should return the sum of integers from 1 to n inclusive,
      but it has a bug. Fix it. Reply with just the corrected Python code block.

      ```python
      def sum_to_n(n: int) -> int:
          total = 0
          for i in range(n):
              total += i
          return total
      ```
    scoring:
      type: code_exec_python
      tests:
        - "assert sum_to_n(0) == 0"
        - "assert sum_to_n(1) == 1"
        - "assert sum_to_n(10) == 55"
        - "assert sum_to_n(100) == 5050"
    max_tokens: 1536
  - id: debug-02-mutable-default
    prompt: |
      `append_one` should append 1 to the given list and return it, defaulting to
      a fresh empty list when no list is given. Bug: subsequent calls share state.
      Fix it. Reply with just the corrected Python code block.

      ```python
      def append_one(xs=[]):
          xs.append(1)
          return xs
      ```
    scoring:
      type: code_exec_python
      tests:
        - "assert append_one([]) == [1]"
        - "assert append_one() == [1]"
        - "assert append_one() == [1]"
        - "a = []; b = append_one(a); assert b is a and a == [1]"
    max_tokens: 1536
