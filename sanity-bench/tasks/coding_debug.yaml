  - id: debug-23-binary-search-ob1
    prompt: |
      `binary_search` should return the index of target in sorted xs, or -1 if not found. The buggy version misses the last element. Fix it. Reply with corrected Python code block.

      ```python
      def binary_search(xs: list[int], target: int) -> int:
          lo, hi = 0, len(xs) - 1
          while lo < hi:
              mid = (lo + hi) // 2
              if xs[mid] == target:
                  return mid
              if xs[mid] < target:
                  lo = mid + 1
              else:
                  hi = mid - 1
          return -1
      ```
    scoring:
      type: code_exec_python
      tests:
        - "assert binary_search([1,2,3,4,5], 5) == 4"
        - "assert binary_search([1,2,3,4,5], 1) == 0"
        - "assert binary_search([1,2,3,4,5], 6) == -1"
        - "assert binary_search([], 1) == -1"
        - "assert binary_search([5], 5) == 0"
    max_tokens: 1024

