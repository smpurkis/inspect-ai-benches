category: common_sense
tasks:
- id: cs-01-ice-water-level
  prompt: 'A glass is filled to the brim with water and an ice cube is floating in
    it. The ice cube contains a small air bubble trapped inside. After the ice cube
    melts completely, will the water level in the glass rise, fall, or stay exactly
    the same? Answer with one word.

    '
  scoring:
    type: regex
    pattern: (?i)^\s*fall\s*\.?\s*$
  max_tokens: 256
- id: cs-02-balloon-car
  prompt: 'You are driving at a constant speed on a straight road with a helium-filled
    balloon floating in the center of the car''s cabin. Without using the brakes or
    accelerator, you make a sharp left turn. Relative to the car, which direction
    does the balloon move? Answer with left or right.

    '
  scoring:
    type: regex
    pattern: (?i)^\s*left\s*\.?\s*$
  max_tokens: 256
- id: cs-03-fifty-soldiers
  prompt: 'Fifty soldiers stand in a line. The first soldier fires one bullet. Each
    subsequent soldier fires one more bullet than the soldier before them. How many
    total bullets are fired? Answer with just the number.

    '
  scoring:
    type: regex_number
    expected: 1275
  max_tokens: 512
- id: cs-04-bridge-crossing-fermi
  prompt: 'Without looking it up, estimate the total number of cars that cross the
    Golden Gate Bridge in a typical year. The bridge has six lanes and daily traffic
    averages roughly 110,000 vehicles. State your estimate as a single number in scientific
    notation (e.g., 4e7).

    '
  scoring:
    type: regex
    pattern: 4\s*[eE]\s*7|4[0.]*[eE]\s*7|4[eE][+]?07
  max_tokens: 512
- id: cs-05-theory-mind-sandwich
  prompt: 'Alice knows that Bob knows that Charlie knows that the cookies are in the
    red jar. Bob knows that Charlie does not know that Alice knows that the cookies
    were moved to the blue jar. Charlie does not know that Bob knows they were moved.
    How many levels of recursive belief are represented in the full chain from Alice
    about Bob about Charlie?

    '
  scoring:
    type: regex
    pattern: \b[34]\b
  max_tokens: 512
- id: cs-06-hot-water-freeze
  prompt: 'Under certain conditions, hot water can freeze faster than cold water,
    a phenomenon known as the Mpemba effect. Several explanations have been proposed
    including evaporation, convection, and supercooling. If you place two identical
    cups — one with water at 90°C and one at 30°C — in a freezer at -18°C, which will
    likely freeze first and what is the primary proposed mechanism?

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: contains_any
      expected:
      - hot
      - '90'
      - 90°C
    - type: contains_any
      expected:
      - evaporation
      - convection
      - supercooling
  max_tokens: 384
- id: cs-07-empty-bucket-well
  prompt: 'An empty bucket on a rope is lowered into a deep well. The bucket hangs
    above the water surface and begins to swing slightly. After several oscillations,
    the swing amplitude decreases. Is the oscillation damped primarily by air resistance,
    or does the rope''s torsion play a significant role? If the well is 50 meters
    deep, roughly how many oscillations occur before amplitude halves?

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: contains_any
      expected:
      - air resistance
      - both
      - air
    - type: regex
      pattern: \b([5-9]|[1-3][0-9]|4[0-9])\b
  max_tokens: 512
- id: cs-08-shadow-length
  prompt: 'A 2-meter-tall person stands at the equator at the March equinox at solar
    noon. The sun is directly overhead, so the person casts no shadow. If the person
    walks exactly 100 kilometers north, and the Earth''s radius is approximately 6371
    km, what is the angle of the sun from vertical at that new location, and to the
    nearest centimeter, how long is their shadow?

    '
  scoring:
    type: json_schema
    schema:
      type: object
      properties:
        angle_degrees:
          type: number
        shadow_cm:
          type: integer
      required:
      - angle_degrees
      - shadow_cm
  max_tokens: 512
- id: cs-09-plane-conveyor-belt
  prompt: 'A plane is on a massive conveyor belt that moves backward at exactly the
    same speed as the plane''s wheels rotate forward. The plane''s engines provide
    thrust through the air (not through the wheels). Can the plane take off? Answer
    yes or no and explain why in one sentence.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: ^\s*yes\b
      flags:
      - I
    - type: contains_any
      expected:
      - air
      - wing
      - lift
      - relative to air
      - airspeed
  max_tokens: 512
- id: cs-10-save-five-strangers
  prompt: 'A runaway trolley is heading toward five people. You can pull a lever to
    divert it onto a side track, but doing so will kill one person. Now consider a
    second scenario: a surgeon can save five patients who each need a different organ
    by killing one healthy person and harvesting their organs. Most people approve
    the lever pull but not the surgeon. Which philosophical distinction best explains
    this asymmetry?

    '
  scoring:
    type: contains_any
    expected:
    - doctrine of double effect
    - double effect
    - intention
    - means vs side effect
  max_tokens: 384
- id: cs-11-sound-speed-cold
  prompt: 'The speed of sound in air depends on temperature according to v = 331 m/s
    × sqrt(T/273 K), where T is in Kelvin. On a day when the temperature is -20°C,
    compared to a 20°C day, by approximately what percentage does the speed of sound
    decrease? Answer with just the nearest whole number percentage.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: \b[67]\b
    - type: contains
      expected: '%'
  max_tokens: 512
- id: cs-12-fish-bowl-scale
  prompt: 'A bowl of water sits on a digital scale reading 500 grams. A fish weighing
    200 grams is swimming in the water. While the fish is suspended in the water (not
    touching the bottom), what does the scale read? Now assume the fish dies and sinks
    to the bottom. What does the scale read then? Give both readings as two comma-separated
    numbers.

    '
  scoring:
    type: contains
    expected: '700'
  max_tokens: 384
- id: cs-13-bird-power-lines
  prompt: 'A bird sits on a high-voltage power line carrying 500 kV and is unharmed.
    Why? If a second bird touches the same wire and also touches a grounded metal
    tower simultaneously, what happens? Answer each subquestion in one sentence.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: contains_any
      expected:
      - potential difference
      - no voltage
      - same potential
      - not completing
      - no path
    - type: contains_any
      expected:
      - electrocuted
      - shock
      - killed
      - current flows
      - grounded
  max_tokens: 512
- id: cs-14-falling-cat
  prompt: 'A cat dropped upside-down from a height of 2 meters can almost always land
    on its feet, using the "cat righting reflex." However, the cat cannot right itself
    if dropped from too short a distance (less than 30 cm). If dropped from a great
    height (6+ stories), cats have a surprisingly high survival rate, though this
    may seem counterintuitive. What physical reason explains survival at high falls
    compared to medium falls?

    '
  scoring:
    type: contains_any
    expected:
    - terminal velocity
    - terminal speed
    - max speed
    - relax
  max_tokens: 384
- id: cs-15-ship-lock-water-level
  prompt: 'A loaded cargo ship enters a canal lock, displacing its weight in water.
    When the ship enters the lock, the water level within the lock chamber rises.
    If the ship then unloads its cargo onto the dock while still inside the lock,
    does the water level in the lock rise, fall, or stay the same compared to before
    unloading? Answer with one word.

    '
  scoring:
    type: regex
    pattern: (?i)^\s*fall\s*\.?\s*$
  max_tokens: 384
- id: cs-16-counterfeit-balls-12
  prompt: 'You have 12 identical-looking balls. One is counterfeit and is either heavier
    OR lighter than the rest — you do not know which. What is the minimum number of
    weighings on a two-pan balance scale needed to guarantee identifying the counterfeit
    and determining whether it is heavier or lighter? Answer with just the number.

    '
  scoring:
    type: regex_number
    expected: 3
  max_tokens: 512
- id: cs-17-two-doors-know-not
  prompt: 'Two guards stand before two doors. One door leads to freedom, one to death.
    One guard always lies, one always tells the truth. You do not know which guard
    is which. You are allowed exactly one yes-or-no question directed to a single
    guard. What question should you ask to guarantee freedom?

    '
  scoring:
    type: contains_any
    expected:
    - what would the other
    - would the other
    - what would the other guard say
  max_tokens: 384
- id: cs-18-cold-metal-wood
  prompt: 'At room temperature, a metal doorknob and a wooden door feel equally cold
    to the touch when measured with a thermometer. However, if you touch them, the
    metal feels colder. If the room temperature is 20°C and the metal is indeed at
    20°C, what property of the metal causes the sensation of coldness, and what is
    this sensation actually measuring?

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: contains_any
      expected:
      - thermal conductivity
      - conductivity
      - heat transfer
    - type: contains_any
      expected:
      - heat flow
      - heat transfer rate
      - temperature change of skin
  max_tokens: 384
- id: cs-19-race-pacing-fermi
  prompt: 'A runner completes the first half of a 10 km race at 5 minutes per kilometer
    pace. How fast must they run the second half to average 4 minutes per kilometer
    for the entire race? Give your answer in minutes per kilometer as a decimal.

    '
  scoring:
    type: regex
    pattern: 3\.\s*33|3\.33|3:20|10/3
  max_tokens: 512
- id: cs-20-butterfly-pinball
  prompt: 'In chaos theory, the butterfly effect describes how small changes in initial
    conditions can produce vastly different outcomes in deterministic nonlinear systems.
    Lorenz discovered this using a simplified model of atmospheric convection. If
    you could measure the position and momentum of every particle in a system to infinite
    precision, would chaotic systems become predictable? Answer yes or no and explain.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: ^\s*yes\b
      flags:
      - I
    - type: contains_any
      expected:
      - deterministic
      - Laplace
      - infinite precision
      - theoretically
  max_tokens: 512
