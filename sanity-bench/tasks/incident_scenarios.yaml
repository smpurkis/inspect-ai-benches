category: incident_scenarios
tasks:
- id: isc-01-sev1-competing
  prompt: 'Two SEV-1s just fired: (A) Payment API returning 500s on 40% of requests

    (affecting paying customers). (B) User profile DB replica lag = 300s,

    read-your-writes broken for all users. You are sole on-call. Choose

    which to handle first with rationale. Then list ≥5 numbered steps to

    resolve BOTH. Include escalation triggers at each step.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: (?m)^1\.
    - type: regex
      pattern: (?m)^5\.
    - type: contains_all
      expected:
      - payment
      - replica
      - lag
    - type: contains_any
      expected:
      - escalat
      - page
      - notify
      - incident commander
  max_tokens: 768
  temperature: 0.4
- id: isc-02-oncall-zero-context
  prompt: 'You pick up the on-call phone at 2 AM. No handover notes. Alerts:

    p99 latency 200ms→6s (started 40min ago), error rate 15% (norm <1%).

    Last deploy 50min ago by engineer now offline. List ≥6 numbered

    investigation steps. Each step: what to check, which tool/command, and

    what a normal result looks like. First step: check deploy dashboard.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: (?m)^1\.
    - type: regex
      pattern: (?m)^6\.
    - type: contains_any
      expected:
      - deploy
      - rollback
      - revert
      - dashboard
    - type: contains_any
      expected:
      - grafana
      - datadog
      - prometheus
      - metrics
      - log
  max_tokens: 768
  temperature: 0.5
- id: isc-03-postmortem-structured
  prompt: 'Write a post-mortem for an outage: A config change removed rate limits

    from the auth service, causing cascading failures across 12 services

    for 47 minutes. Required sections (1-2 sentences each):

    Summary, Timeline, Root Cause, Impact, Detection, Resolution,

    5 Whys, Action Items (with owners), Prevention. No blame language.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: contains_all
      expected:
      - Summary
      - Timeline
      - Root Cause
      - Impact
      - Detection
      - Resolution
      - 5 Whys
      - Action Items
      - Prevention
    - type: length_range
      min: 10
      max: 20
      unit: lines
    - type: regex
      pattern: ^(?!(?:.*\bblame\b|.*\bfault\b|.*\bsloppy\b)).*$
      flags:
      - I
      - S
  max_tokens: 1024
  temperature: 0.3
- id: isc-04-db-mass-delete
  prompt: 'A developer ran DELETE FROM orders WHERE created_at < ''2024-01-01'' on

    production. No backup. The query has been running for 6 minutes and

    2M rows deleted so far (8M total). List ≥6 numbered chronological

    response steps. Must include: kill query, disable app access, snapshot

    current state, WAL-based PITR, verify data integrity, stakeholder

    notification timing. Step 2 MUST be "Disable application access."

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: ^2\. Disable application access\.
      flags:
      - M
    - type: regex
      pattern: (?m)^6\.
    - type: contains_all
      expected:
      - kill
      - PITR
      - WAL
      - snapshot
      - integrity
    - type: contains_any
      expected:
      - stakeholder
      - notify
      - incident commander
  max_tokens: 768
  temperature: 0.4
- id: isc-05-secret-exfil
  prompt: 'A PR from a fork with AWS keys in a config file was auto-merged to main

    15 minutes ago. The keys have full S3 and EC2 access. List ≥7 numbered

    response steps covering: key revocation, secret rotation, git history

    cleanup (git filter-branch), fork audit, branch protection, notification

    to security team, and post-mortem timeline. Step 1: "Revoke keys."

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: ^1\. Revoke keys\.
      flags:
      - M
    - type: regex
      pattern: (?m)^7\.
    - type: contains_all
      expected:
      - rotate
      - git filter
      - fork
      - branch protection
      - audit
  max_tokens: 768
  temperature: 0.5
- id: isc-06-three-pm-priorities
  prompt: 'Three PMs each claim their feature blocks the release:

    PM-A: "Realtime dashboard refresh" (2h, CSS/JS only)

    PM-B: "Payment idempotency keys" (3d, data integrity)

    PM-C: "Export to PDF" (6h, nice-to-have)

    You have 5 days. Write ≥5 numbered negotiation steps for a meeting with

    all three. Outcome: PM-C deferred. Include risk analysis for each step.

    Begin: "1. Present data integrity risk analysis for PM-C deferral."

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: ^1\. Present data integrity risk analysis for PM-C deferral\.
      flags:
      - M
    - type: regex
      pattern: (?m)^5\.
    - type: contains_all
      expected:
      - risk
      - idempotency
      - defer
      - data
    - type: contains_any
      expected:
      - trade-off
      - compromise
      - MVP
      - scope
  max_tokens: 768
  temperature: 0.5
- id: isc-07-arch-review
  prompt: 'Engineering proposes: "Replace our Postgres DB with DynamoDB for all

    customer data." Evaluate against 6 criteria: consistency model,

    query flexibility, cost at 10TB, operational complexity, migration

    risk, and team expertise. For each: score 1-5 and 1 sentence rationale.

    End with your verdict (approve/reject/conditional) and conditions.

    '
  scoring:
    type: composite
    mode: mean
    parts:
    - type: contains_all
      expected:
      - consistency
      - query
      - cost
      - complexity
      - migration
      - expertise
    - type: contains_any
      expected:
      - approve
      - reject
      - conditional
    - type: regex
      pattern: \b[1-5]\b
    - type: length_range
      min: 12
      max: 30
      unit: lines
  max_tokens: 1024
  temperature: 0.3
- id: isc-08-downstream-degraded
  prompt: 'Your checkout service depends on AcmePay. p99 is 8s, 30% timeout rate.

    AcmePay says "working as intended." CEO wants it fixed TODAY. List ≥5

    numbered options ranked from least to most extreme. Each: option name,

    1-sentence description, trade-off in parentheses. Include at least:

    caching, circuit breaker, async fallback, vendor switch prep, and

    contractual escalation.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: (?m)^1\.
    - type: regex
      pattern: (?m)^5\.
    - type: contains_all
      expected:
      - cache
      - circuit breaker
      - fallback
      - escalation
    - type: regex
      pattern: \(.*\).*\(.*\)
  max_tokens: 768
  temperature: 0.5
- id: isc-09-migration-decision
  prompt: 'Mid-migration from Mongo to Postgres: 40% done. Bug found: 5% of

    migrated records have null email. Current DB still live with writes

    dual-written. Options: rollback (lose 40%), forward-fix (update nulls

    from source, complex), hotfix in destination (riskier). List ≥6

    numbered decision criteria. State your choice and 2-sentence

    justification based on data integrity and timeline.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: (?m)^1\.
    - type: regex
      pattern: (?m)^6\.
    - type: contains_all
      expected:
      - rollback
      - forward
      - hotfix
      - 'null'
    - type: contains_any
      expected:
      - dual-write
      - integrity
      - timeline
      - data loss
  max_tokens: 768
  temperature: 0.5
- id: isc-10-vendor-breach-response
  prompt: 'AuthCorp (your SSO vendor) notifies you: their API keys, user email

    hashes, and MFA seeds were exfiltrated. List ≥7 numbered response

    steps covering: breach verification, key rotation, forced password

    reset, MFA re-enrollment, user notification template, vendor SLA

    enforcement, and regulatory reporting timeline. Step 3: "Force password

    reset for all users."

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: ^3\. Force password reset for all users\.
      flags:
      - M
    - type: regex
      pattern: (?m)^7\.
    - type: contains_all
      expected:
      - rotate
      - MFA
      - notify
      - SLA
      - regulatory
  max_tokens: 768
  temperature: 0.5
- id: isc-11-cloud-cost-spike
  prompt: 'Monthly cloud bill jumped from $15K to $62K. Finance needs answers

    by EOD. List ≥6 numbered investigation steps. Each step: specific

    tool or query AND what anomaly signature you''re looking for. Examples:

    "Cost Explorer → filter by service, look for datalake egress spike" or

    "Trusted Advisor → check idle load balancers." Include at least 3 tools.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: (?m)^1\.
    - type: regex
      pattern: (?m)^6\.
    - type: contains_any
      expected:
      - Cost Explorer
      - budget
      - anomaly
      - Trusted Advisor
      - spike
    - type: contains_any
      expected:
      - rightsize
      - reserved
      - commitment
      - downsize
  max_tokens: 768
  temperature: 0.4
- id: isc-12-security-researcher-rce
  prompt: 'A security researcher emails: they found RCE in your file upload

    endpoint at POST /api/upload. Proof attached. They ask for $10K

    bounty. Your company has no bug bounty program. List ≥6 numbered

    response steps for: acknowledgment, reproduce in staging, triage

    severity (CVSS), hotfix deploy, coordinated disclosure, and bounty

    decision. Include CVE disclosure best practices.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: (?m)^1\.
    - type: regex
      pattern: (?m)^6\.
    - type: contains_all
      expected:
      - CVSS
      - reproduce
      - disclosure
      - CVE
      - hotfix
    - type: contains_any
      expected:
      - acknowledge
      - thank
      - timeline
      - coordinated
  max_tokens: 768
  temperature: 0.5
- id: isc-13-strangler-fig
  prompt: 'Monolith "MonolithApp" crashes under any load spike. CTO approves

    3-month strangler fig migration to microservices. List ≥6 numbered

    migration steps: identify bounded contexts, API gateway setup, parallel

    run, traffic shifting, cut-off criteria, and rollback plan. Each step:

    action AND risk in [brackets]. Begin: "1. Map bounded contexts."

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: ^1\. Map bounded contexts\.
      flags:
      - M
    - type: regex
      pattern: (?m)^6\.
    - type: contains_all
      expected:
      - gateway
      - parallel
      - cut-off
      - rollback
    - type: regex
      pattern: \[.*\]
  max_tokens: 1024
  temperature: 0.5
- id: isc-14-llm-prompt-leak
  prompt: 'Your customer-facing AI chatbot leaked its system prompt to a user.

    The user posted it on X (2K RTs, trending). The prompt contained

    internal API endpoints and business rules. List ≥6 numbered response

    steps covering: prompt fix, input/output guardrails, rate limiting,

    PR response, legal hold, and post-mortem. Step 2: "Add output

    guardrails to block system prompt leakage."

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: ^2\. Add output guardrails to block system prompt leakage\.
      flags:
      - M
    - type: regex
      pattern: (?m)^6\.
    - type: contains_all
      expected:
      - guardrail
      - rate limit
      - legal
      - post-mortem
    - type: contains_any
      expected:
      - X
      - social
      - statement
      - PR
      - communicat
  max_tokens: 768
  temperature: 0.5
- id: isc-15-capacity-100x
  prompt: 'Your board asks: "Can we handle 100x traffic in 6 months?"

    Current stack: 4 microservices on EKS (16 pods each, c5.large),

    1 Postgres RDS db.r5.xlarge, Redis cluster 3 nodes, S3 + CloudFront.

    List ≥6 numbered analysis steps: load testing plan, DB sharding/read

    replicas, HPA config, cost projection for 100x, and a 2-sentence

    verdict. Include a table with estimated nodes/DB size/cost per tier.

    '
  scoring:
    type: composite
    mode: all
    parts:
    - type: regex
      pattern: (?m)^1\.
    - type: regex
      pattern: (?m)^6\.
    - type: contains_all
      expected:
      - load test
      - shard
      - read replica
      - HPA
      - cost
    - type: regex
      pattern: \d+.*nodes|\d+.*pods|\d+.*GB
  max_tokens: 1024
  temperature: 0.4
- id: isc-41-db-pool-exhaustion
  prompt: 'ON-CALL ALERT: p99 latency 200ms -> 6s, error rate 15% (norm <1%).

    Use mock_api(operation, params) to investigate and fix.


    Available operations:

    - check_alerts() - view active alerts

    - check_logs() - view recent error logs

    - check_health() - check service health

    - increase_pool(size) - increase DB connection pool

    - restart_service(service) - restart a service

    - verify_fix() - confirm the fix worked


    Step 1: Investigate (check_alerts, check_logs, check_health).

    Step 2: Fix (increase_pool + restart_service).

    Step 3: Verify (verify_fix).

    Step 4: Write a brief summary.

    '
  scoring:
    type: tool_sequence
    expected:
    - operation: check_alerts
    - operation: check_logs
    - operation: check_health
    - operation: increase_pool
    - operation: restart_service
    - operation: verify_fix
  max_tokens: 2048
  temperature: 0.3
- id: isc-42-replica-lag
  prompt: 'ON-CALL ALERT: DB replica lag = 300s, read-your-writes broken.

    Use mock_api(operation, params) to investigate and fix.


    Available operations:

    - check_replica_lag() - check current replica lag

    - check_logs() - view error logs

    - promote_replica() - promote replica to primary

    - verify_fix() - confirm fix

    - check_health() - check overall health


    Investigate, promote the replica if needed, verify, summarize.

    Call mock_api for each step.

    '
  scoring:
    type: tool_sequence
    expected:
    - operation: check_replica_lag
    - operation: check_logs
    - operation: promote_replica
    - operation: verify_fix
  max_tokens: 2048
  temperature: 0.3
- id: isc-43-disk-full
  prompt: 'ON-CALL ALERT: Disk usage 97% on /data volume. Services degraded.

    Use mock_api(operation, params) to investigate and fix.


    Available operations:

    - check_disk() - check disk usage

    - check_health() - check service health

    - check_logs() - view error logs

    - cleanup_disk() - clean up old WAL files

    - restart_service(service) - restart services

    - verify_fix() - confirm fix


    Investigate, clean up disk, restart affected services, verify.

    Call mock_api for each step then summarize.

    '
  scoring:
    type: tool_sequence
    expected:
    - operation: check_disk
    - operation: check_health
    - operation: cleanup_disk
    - operation: restart_service
    - operation: verify_fix
  max_tokens: 2048
  temperature: 0.3
- id: isc-44-cert-expiry
  prompt: 'ON-CALL ALERT: TLS certificate for api.app.com expires in 14 days.

    Use mock_api(operation, params) to handle this proactively.


    Available operations:

    - check_cert() - check certificate status

    - renew_cert() - renew the certificate

    - check_health() - check service health

    - test_endpoint() - test HTTPS endpoint

    - check_logs() - view recent logs


    Investigate cert status, renew, verify endpoint still works.

    Call mock_api for each step then summarize.

    '
  scoring:
    type: tool_sequence
    expected:
    - operation: check_cert
    - operation: renew_cert
    - operation: test_endpoint
    - operation: check_health
  max_tokens: 2048
  temperature: 0.3
- id: isc-45-config-drift
  prompt: 'ON-CALL ALERT: payment-api feature flag ''use_v2_payment'' silently

    enabled in production. Customers seeing incorrect totals.

    Use mock_api(operation, params) to investigate and fix.


    Available operations:

    - check_config() - view current config

    - check_alerts() - view active alerts

    - check_logs() - view error logs

    - set_config(key, value) - change a config value

    - verify_fix() - confirm fix


    Investigate the config, disable the flag, verify. Then summarize.

    Call mock_api for each step.

    '
  scoring:
    type: tool_sequence
    expected:
    - operation: check_config
    - operation: check_alerts
    - operation: set_config
    - operation: verify_fix
  max_tokens: 2048
  temperature: 0.3
