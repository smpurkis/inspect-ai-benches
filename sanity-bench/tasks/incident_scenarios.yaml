    temperature: 0.5

  - id: isc-40-incident-postmortem-review
    prompt: |
      Review this post-mortem excerpt and identify ≥5 gaps:
      "An engineer made a manual config change that caused an outage. We
      fixed it by reverting. Action items: be more careful, review changes."
      Criticize each gap using incident analysis best practices (blameless
      culture, systemic root cause, specific action items, measurement).
      Then rewrite the post-mortem properly: Summary, Root Causes (≥2),
      Timeline, Action Items (≥3 with owners and due dates), Prevention.
    scoring:
      type: composite
      mode: all
      parts:
        - {type: regex, pattern: "(?i)gap"}
        - {type: contains_all, expected: ["blameless", "systemic", "owner", "due date"]}
        - {type: contains_all, expected: ["Summary", "Root Causes", "Timeline", "Action Items", "Prevention"]}
        - {type: length_range, min: 15, max: 35, unit: lines}
    max_tokens: 1024
    temperature: 0.3
