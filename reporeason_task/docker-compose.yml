services:
  reporeason-task:
    x-default: true
    image: reporeason-task:latest
    build:
      context: .
      args:
        DEFAULT_PORT: ${HOST_PORT:-5000}
    network_mode: "host"
    volumes:
      - "${REPO_MOUNT:-./workspace/repo}:/app"
      - "${OPENCODE_CONFIG:-./opencode.json}:/app/opencode.json:ro"
    working_dir: /app
    environment:
      - OPCODE_PORT=${HOST_PORT:-5000}
      - PORT=${HOST_PORT:-5000}
