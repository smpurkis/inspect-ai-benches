[task]
id = "pandas-to-polars-single"
entry = "/app/files/pipeline_polars.py"
command = "python3 /app/files/pipeline_polars.py --in <input_dir> --out <output_dir>"
public_test = "python3 -m pytest -q /app/files/tests.py"

[limits]
max_agent_turns = 24
max_weighted_tool_cost = 44
max_public_test_runs = 3
max_file_read_bytes = 180000
wall_clock_seconds = 43200
max_model_tokens = 72000

[policy]
network = false
editable = ["normalization.py"]
forbid_imports = ["pandas"]
require_determinism = true

[implementation]
forbid_calls = ["pl.read_parquet", "pl.read_csv", "to_pandas"]

[kernel]
function = "normalize_and_quarantine(source, merchants)"
execution = "lazy; no collect, eager reads, pandas, or fixture access"
priority = ["NULL_REQUIRED", "INVALID_DATE", "NEGATIVE_AMOUNT", "MISSING_MERCHANT", "INACTIVE_MERCHANT"]
valid_sort = ["merchant_id", "event_date", "row_id"]
quarantine_sort = ["row_id"]
timezone = "timezone-aware UTC instants"
target_patch_loc = "80-140"
