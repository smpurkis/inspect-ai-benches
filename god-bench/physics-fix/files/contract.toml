[task]
id = "physics-fix"
entry = "/app/files/src/event.rs"
build = "cp /app/files/Cargo.toml /app/Cargo.toml && rm -rf /app/src && cp -r /app/files/src /app/src && cd /app && cargo test --release --offline"
public_test = "python3 -m pytest -q /app/files/tests.py"

[limits]
max_model_tokens = 72000
max_agent_turns = 20
max_weighted_tool_cost = 40
max_public_test_runs = 3
max_file_read_bytes = 120000
wall_clock_seconds = 43200

[policy]
network = false
editable = ["src/event.rs"]
require_determinism = true

[implementation]
read_only = ["Cargo.toml", "src/lib.rs", "tests.py"]
writable_outputs = ["/app/src/event.rs", "/app/target/**"]
allowed_dependencies = []

[numerics]
finite_outputs = true
event_time_atol = 1e-9
dense_state_atol = 1e-9
directions = ["rising", "falling", "any"]
events = ["pressure_zero", "horizon", "collapse"]
