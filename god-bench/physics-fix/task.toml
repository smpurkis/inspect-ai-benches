schema_version = "1.4"
artifacts = ["/app/files/src/event.rs"]

[task]
name = "god-bench/physics-fix"
version = "2.0.0"
description = "Localize physical events in supplied RK45 dense output."
authors = []
keywords = ["rust", "physics", "ode", "dense-output", "root-finding"]

[metadata]
difficulty = "hard"
category = "physics"
strict = true

[agent]
timeout_sec = 43200.0
max_model_tokens = 72000

[verifier]
timeout_sec = 3600.0
environment_mode = "separate"

[environment]
network_mode = "no-network"
build_timeout_sec = 3600.0
cpus = 8
memory_mb = 8192
storage_mb = 10240
gpus = 0
