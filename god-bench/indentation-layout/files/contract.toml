[task]
id = "indentation-layout"
entry = "/app/files/src/Layout.hs"
build = "bash /app/files/run_tests.sh build"
public_test = "python3 -m pytest -q /app/files/tests.py"

[limits]
max_agent_turns = 24
max_weighted_tool_cost = 44
max_public_test_runs = 4
max_file_read_bytes = 180000
max_model_tokens = 264000
wall_clock_seconds = 43200

[policy]
network = false
editable = ["src/Layout.hs"]
require_determinism = true

[implementation]
read_only = ["TASK.md", "run_tests.sh", "tests.py", "scaffold/**"]
writable_outputs = ["/app/files/src/Layout.hs", "/tmp/indentation-layout-build/**"]
allowed_dependencies = []
