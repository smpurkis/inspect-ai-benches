[task]
id = "rust-python-pyo3"
entry = "/app/files/src/francis.rs"
build = "cp /app/files/Cargo.toml /app/Cargo.toml && cp /app/files/pyproject.toml /app/pyproject.toml && rm -rf /app/src && cp -r /app/files/src /app/src && cd /app && maturin develop --release --offline"
public_test = "python3 -m pytest -q /app/files/tests.py"

[limits]
max_model_tokens = 96000
max_agent_turns = 24
max_weighted_tool_cost = 48
max_public_test_runs = 3
max_file_read_bytes = 180000
wall_clock_seconds = 43200

[policy]
network = false
editable = ["src/francis.rs"]
forbid_imports = ["numpy.linalg", "scipy.linalg", "ctypes", "cffi", "cython"]
require_determinism = true

[implementation]
read_only = ["Cargo.toml", "pyproject.toml", "src/lib.rs", "src/matrix.rs", "src/hessenberg.rs", "tests.py"]
writable_outputs = ["/app/src/francis.rs", "/app/target/**"]
allowed_dependencies = ["pyo3"]
forbid_python_execution = true

[numerics]
dtype = "float64"
reconstruction_atol = 2e-9
orthogonality_atol = 2e-10
stress_atol = 2e-7
finite_outputs = true
upper_hessenberg_preserved_per_sweep = true
real_2x2_blocks_are_terminal = true
