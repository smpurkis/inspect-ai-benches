[task]
id = "self-hosted-interpreter-core"
kind = "compiler-interpreter"
entry = "/app/files/samscript_bootstrap.sam"
public_test = "python3 -m pytest -q /app/files/tests.py"

[limits]
max_agent_turns = 36
max_weighted_tool_cost = 64
max_public_test_runs = 4
max_file_read_bytes = 45000
wall_clock_seconds = 1800
max_model_tokens = 32768

[budgets.compiler]
max_runs = 4
seconds_per_run = 600

[budgets.interpreter]
max_runs = 40
seconds_per_run = 180

[policy]
network = false
editable = ["samscript_bootstrap.sam"]
require_determinism = true
