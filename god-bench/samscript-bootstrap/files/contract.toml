[task]
id = "samscript-bootstrap-scope-control"
kind = "compiler-interpreter"
entry = "/app/files/runtime.py"
public_test = "python3 -m pytest -q /app/files/tests.py"

[limits]
max_agent_turns = 24
max_weighted_tool_cost = 64
max_public_test_runs = 4
max_file_read_bytes = 80000
wall_clock_seconds = 43200
max_model_tokens = 264000

[budgets.interpreter]
max_runs = 40
seconds_per_run = 30

[policy]
network = false
editable = ["runtime.py"]
require_determinism = true
