[task]
id = "cifar10-burn"
entry = "/app/files/cifar-infer/src/training_policy.rs"
build = "cp /opt/cifar-infer-Cargo.lock /app/files/cifar-infer/Cargo.lock && cd /app/files/cifar-infer && cargo build --release --locked --offline"
public_test = "python3 -m pytest -q /app/files/tests.py"
outputs = ["cifar-infer/Cargo.lock", "cifar-infer/target/**"]

[limits]
max_agent_turns = 28
max_weighted_tool_cost = 52
max_public_test_runs = 3
max_file_read_bytes = 220000
wall_clock_seconds = 43200
max_model_tokens = 72000

[policy]
network = false
editable = ["cifar-infer/src/training_policy.rs"]
require_determinism = true

[security]
reject_extra_source_files = true
reject_symlinks = true

[calibration]
target_changed_lines = "70-130"
