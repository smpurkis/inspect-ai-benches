[task]
id = "cifar10-burn"
entry = "/app/files/cifar-infer/Cargo.toml"
build = "cp /opt/cifar-infer-Cargo.lock /app/files/cifar-infer/Cargo.lock && CARGO_NET_OFFLINE=true CARGO_TARGET_DIR=/app/files/cifar-infer/target RAYON_NUM_THREADS=8 OMP_NUM_THREADS=8 cargo build --quiet --release --locked --offline --manifest-path /app/files/cifar-infer/Cargo.toml && CARGO_NET_OFFLINE=true RAYON_NUM_THREADS=8 OMP_NUM_THREADS=8 timeout --signal=KILL 1200s /app/files/cifar-infer/target/release/cifar-train --train-npz /app/files/cifar_tiny.npz --config /app/files/cifar-infer/training.toml --model-out /app/files/cifar-infer/model.mpk && CARGO_NET_OFFLINE=true RAYON_NUM_THREADS=8 OMP_NUM_THREADS=8 timeout --signal=KILL 120s /app/files/cifar-infer/target/release/cifar-infer --input-npz /app/files/cifar_public_test.npz --output-npy /app/files/burn_public_test_preds.npy"
training = "CARGO_NET_OFFLINE=true RAYON_NUM_THREADS=8 OMP_NUM_THREADS=8 timeout --signal=KILL 1200s /app/files/cifar-infer/target/release/cifar-train --train-npz /app/files/cifar_tiny.npz --config /app/files/cifar-infer/training.toml --model-out /app/files/cifar-infer/model.mpk"
inference = "CARGO_NET_OFFLINE=true RAYON_NUM_THREADS=8 OMP_NUM_THREADS=8 timeout --signal=KILL 120s /app/files/cifar-infer/target/release/cifar-infer --input-npz <images.npz> --output-npy <predictions.npy>"
public_test = "python3 -m pytest -q /app/files/tests.py"

[artifacts]
project = "/app/files/cifar-infer"
manifest = "/app/files/cifar-infer/Cargo.toml"
lockfile = "/app/files/cifar-infer/Cargo.lock"
model_source = "/app/files/cifar-infer/src/model.rs"
training_source = "/app/files/cifar-infer/src/train.rs"
training_config = "/app/files/cifar-infer/training.toml"
model = "/app/files/cifar-infer/model.mpk"
public_predictions = "/app/files/burn_public_test_preds.npy"
training_binary = "/app/files/cifar-infer/target/release/cifar-train"
inference_binary = "/app/files/cifar-infer/target/release/cifar-infer"

[limits]
max_agent_turns = 28
max_model_tokens = 24000
max_weighted_tool_cost = 52
max_public_test_runs = 2
max_file_read_bytes = 180000
wall_clock_seconds = 3600

[ml]
max_training_seconds = 1200
max_inference_seconds = 120
max_model_bytes = 100000000
max_command_output_bytes = 4096
max_public_prediction_bytes = 4096
min_public_accuracy = 0.60
min_hidden_accuracy = 0.60
min_perturbed_hidden_accuracy = 0.60
max_cpu_threads = 8

[policy]
network = false
editable = [
    "cifar-infer/src/model.rs",
    "cifar-infer/src/train.rs",
    "cifar-infer/training.toml",
]
require_determinism = true

[security]
read_only = [
    "cifar-infer/Cargo.toml",
    "cifar-infer/src/main.rs",
    "TASK.md",
    "contract.toml",
    "tests.py",
    "cifar_tiny.npz",
    "cifar_public_test.npz",
]
pretrained = false
writable_generated_dirs = ["/app/files/cifar-infer/target"]
writable_files = [
    "/app/files/cifar-infer/src/model.rs",
    "/app/files/cifar-infer/src/train.rs",
    "/app/files/cifar-infer/training.toml",
    "/app/files/cifar-infer/model.mpk",
    "/app/files/burn_public_test_preds.npy",
]
generated_files = [
    "/app/files/cifar-infer/Cargo.lock",
    "/app/files/cifar-infer/model.mpk",
    "/app/files/burn_public_test_preds.npy",
]
forbid_python_training = true
forbid_python_inference = true
forbid_build_scripts = true
forbid_subprocesses = true
scan_entire_project = true
allowed_dependencies = ["burn", "ndarray", "ndarray-npy"]
