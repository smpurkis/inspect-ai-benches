schema_version = "1.4"
artifacts = ["/app/files/cifar-infer/src/training_policy.rs"]

[task]
name = "god-bench/cifar10-burn"
version = "2.0.0"
description = "Complete deterministic CIFAR-10 training policy kernels in Rust."
authors = []
keywords = ["rust", "burn", "machine-learning", "cifar10"]

[metadata]
difficulty = "hard"
category = "machine-learning"
strict = true

[agent]
timeout_sec = 43200.0
max_model_tokens = 72000

[verifier]
timeout_sec = 3600.0
environment_mode = "separate"

[environment]
network_mode = "no-network"
build_timeout_sec = 3600.0
cpus = 8
memory_mb = 8192
storage_mb = 10240
gpus = 0
