[task]
id = "samscript-wasi-structured-lowering"
kind = "compiler-backend"
entry = "/app/files/lowering.py"
public_test = "python3 -m pytest -q /app/files/tests.py"

[limits]
max_agent_turns = 24
max_weighted_tool_cost = 72
max_public_test_runs = 4
max_file_read_bytes = 80000
wall_clock_seconds = 43200
max_model_tokens = 264000

[budgets.compiler]
max_runs = 40
seconds_per_run = 30

[budgets.runtime]
max_runs = 20
seconds_per_run = 60

[policy]
network = false
editable = ["lowering.py"]
require_determinism = true
